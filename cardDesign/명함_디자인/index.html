<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:type" content="website">

<meta property="og:title" content="ZNUS">
<meta property="og:description" content="ZNUS Digital Profile">
<meta property="og:url" content="https://www.znus.co.kr/">
<meta property="og:image" content="assets/logo_s_aw.svg">

  name="format-detection"

>

  rel="apple-touch-icon"
  sizes="180x180"

>

  rel="icon"
  type="image/svg+xml"
  href="assets/logo_s_v.svg"
>
<link
  rel="manifest"
  href="/__ZNUS_CARD_TOKEN__/manifest.webmanifest"
>
<title>ZNUS Digital Profile</title>
<style>
/* =========================================================
   FONT
   ========================================================= */

/*
  한글
  Pretendard
*/
@font-face {
    font-family: "Pretendard";
    src: url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Pretendard";
    src: url("https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
/*
  영문
  Paperlogy
*/
@font-face {
    font-family: "Paperlogy";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: "Paperlogy";
    src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2") format("woff2");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
@property --float-rotate-x {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
}
@property --float-rotate-y {
    syntax: "<angle>";
    inherits: false;
    initial-value: 0deg;
}
@property --float-light-x {
    syntax: "<percentage>";
    inherits: true;
    initial-value: 50%;
}
@property --float-light-y {
    syntax: "<percentage>";
    inherits: true;
    initial-value: 42%;
}
@property --float-chroma {
    syntax: "<number>";
    inherits: true;
    initial-value: 0;
}
/* =========================================================
   ROOT
   ========================================================= */

:root {
--black:#050505;
--white:#ffffff;
--ease:cubic-bezier(.22, 1, .36, 1);
--ease-soft:cubic-bezier(.16, 1, .3, 1);
--blur:24px;
--card-radius:18px;
--card-contact-shadow: 0 5px 10px rgba(0,0,0,.38);
--card-ambient-shadow: 0 24px 52px rgba(0,0,0,.28);
--card-surface-shadow:
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -1px 0 rgba(2,6,12,.72),
    var(--card-contact-shadow),
    var(--card-ambient-shadow);
--card-edge-gradient:
    radial-gradient(circle at 7% 5%, rgba(255,255,255,.76) 0 1%, rgba(188,229,246,.38) 3%, transparent 11%),
    radial-gradient(circle at 94% 96%, rgba(118,229,239,.44) 0 1%, rgba(76,148,169,.23) 5%, transparent 12%),
    linear-gradient(135deg, rgba(235,244,248,.68) 0%, rgba(171,203,221,.34) 20%, rgba(75,94,110,.20) 46%, rgba(18,27,37,.58) 76%, rgba(105,205,216,.32) 100%);
--page-margin:20px;
--intro-card-width:min(72vw, 520px);
}
/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
html {
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: #000;
    scroll-behavior: smooth;
}
body {
    width: 100%;
    height: 100dvh;
    min-height: 100svh;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Pretendard", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}
button, a {
    color: inherit;
    font: inherit;
}
button {
    border: 0;
    background: none;
    cursor: pointer;
}
a {
    text-decoration: none;
}
/* =========================================================
   ENGLISH FONT
   ========================================================= */

.en {
    font-family: "Paperlogy", sans-serif;
}
/* =========================================================
   GLOBAL UNIVERSE BACKGROUND
   ========================================================= */

.universe-background {
    position: fixed;
    z-index: 0;
    inset: -6%;
    /* 이미지 대신, 카드의 좁은 외곽에서도 읽히는 심우주 컬러 필드 */
    background:
        radial-gradient(ellipse 70% 80% at -18% 32%, #17446b 0%, #09233d 35%, transparent 68%),
        radial-gradient(ellipse 68% 72% at 119% 78%, #372552 0%, #151534 38%, transparent 70%),
        linear-gradient(142deg, #020711 0%, #071426 48%, #02040c 100%);
    transform: scale(1.04);
    animation: universeDrift 32s ease-in-out infinite alternate;
    pointer-events: none;
}
.universe-background:before {
    content: "";
    position: absolute;
    inset: -4%;
    /* 성간 먼지가 카드 양옆을 스쳐 지나가는 깊이감 */
    background:
        linear-gradient(105deg, transparent 0 14%, rgba(69, 164, 220, .20) 26%, transparent 39%),
        linear-gradient(105deg, transparent 57%, rgba(139, 88, 204, .17) 72%, transparent 86%),
        radial-gradient(ellipse 11% 70% at 4% 37%, rgba(67, 178, 226, .32), transparent 76%),
        radial-gradient(ellipse 13% 64% at 97% 69%, rgba(151, 86, 221, .25), transparent 78%),
        radial-gradient(circle, rgba(204, 237, 255, .92) 0 .8px, transparent 1.3px) 14px 29px / 91px 107px,
        radial-gradient(circle, rgba(101, 203, 241, .72) 0 .6px, transparent 1px) 47px 3px / 131px 123px,
        radial-gradient(circle, rgba(255, 255, 255, .48) 0 .55px, transparent .9px) 0 0 / 173px 151px;
    opacity: .96;
    mix-blend-mode: screen;
    animation: deepSpaceDrift 44s linear infinite alternate;
}
@keyframes deepSpaceDrift {
    from { transform: translate3d(0, 0, 0); }
    to { transform: translate3d(-1.2%, .8%, 0); }
}
@keyframes universeDrift {
from {
transform:
scale(1.04) translate3d(0, 0, 0);
}
to {
transform:
scale(1.07) translate3d(-.3%, -.3%, 0);
}
}
.universe-background:after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.035), transparent 55%);
}
/* =========================================================
   FIXED LOGO
   ========================================================= */

.fixed-header {
    position: fixed;
    z-index: 3000;
    top: max( 40px, env(safe-area-inset-top) );
    left: max( 40px, env(safe-area-inset-left) );
    pointer-events: none;
}
.logo-button {
    width: 24px;
    display: block;
    pointer-events: auto;
    opacity: .95;
    transition: opacity .3s ease, transform .3s var(--ease);
}
.logo-button:hover {
    opacity: 1;
}
.logo-button:active {
    transform: scale(.9);
}
.logo-button img {
    width: 100%;
    display: block;
}
/*
  intro에서도 확실하게 보이도록
*/
.intro .fixed-intro-logo {
    position: absolute;
    z-index: 30;
    top: max( 40px, env(safe-area-inset-top) );
    left: max( 40px, env(safe-area-inset-left) );
    width: 24px;
}
.fixed-intro-logo img {
    width: 100%;
    display: block;
}
/* =========================================================
   INTRO
   ========================================================= */

.intro {
    position: fixed;
    inset: 0;
    min-height: 100svh;
    height: 100dvh;
    z-index: 2000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    transition: opacity 1.1s var(--ease), visibility 1.1s;
}
.intro.is-hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
/*
  intro universe layer
  전체 화면을 universe.jpg로 채움
*/
.intro-universe {
    position: absolute;
    inset: -8%;
    background: linear-gradient( 180deg, rgba(0,0,0,.05), rgba(0,0,0,.38) ), url("assets/universe.jpg") center center / cover no-repeat;
    transform: scale(1.04);
    animation: introUniverse 18s ease-in-out infinite alternate;
}
@keyframes introUniverse {
from {
transform:scale(1.04);
}
to {
transform:scale(1.11);
}
}
.intro-universe:after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient( ellipse at center, transparent 15%, rgba(0,0,0,.28) 85%, rgba(0,0,0,.48) );
}
/* =========================================================
   INTRO CONTENT
   ========================================================= */

.intro-content {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
/* =========================================================
   VIDEO START GATE
   ========================================================= */
.video-start-gate {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 100;
    width: 92px;
    height: 92px;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 50%;
    background: rgba(0,0,0,.28);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 18px 60px rgba(0,0,0,.45), inset 0 0 28px rgba(255,255,255,.05);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 1;
    visibility: visible;
    transition: opacity .65s var(--ease), transform .65s var(--ease), visibility .65s;
    -webkit-tap-highlight-color: transparent;
}
.video-start-gate.is-hidden {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
    transform: translate(-50%, -50%) scale(.88) !important;
}

.video-start-gate:before {
    content: "";
    position: absolute;
    inset: -9px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
    animation: gatePulse 2s ease-in-out infinite;
    pointer-events: none;
    animation: none !important;
}
.video-start-gate.is-hidden:before,
.video-start-gate.is-hidden:after {
    animation: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
}

/* 첫 터치를 자연스럽게 유도하는 손짓 */
.video-start-gate:after {
    content: "";
    position: absolute;
    inset: -18px;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 50%;
    opacity: 0;
    animation: touchRipple 2.2s ease-out infinite;
    pointer-events: none;
}

.video-start-gate .palm-icon {
    display: block;
    font-size: 34px;
    line-height: 1;
    transform: translateY(-1px);
    filter: grayscale(1) brightness(3);
    user-select: none;
    -webkit-user-select: none;
    animation: touchHand 1.5s ease-in-out infinite;
}

.video-start-gate:active {
    transform: translate(-50%, -50%) scale(.92);
}

@keyframes touchHand {
    0%, 100% { transform: translateY(-1px) scale(1); }
    45% { transform: translateY(5px) scale(.96); }
    65% { transform: translateY(-1px) scale(1.03); }
}

@keyframes touchRipple {
    0% { opacity: 0; transform: scale(.72); }
    18% { opacity: .65; }
    70%, 100% { opacity: 0; transform: scale(1.18); }
}

/* =========================================================
   LOADING
   ========================================================= */

.loading-area {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    position: absolute;
    left: 50%;
    top: 50%;
    width: min( 75vw, 360px );
    transform: translate(-50%, -50%);
    transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.loading-area.started {
    opacity: 1;
    visibility: visible;
    pointer-events: none;
}
.loading-area.ready-to-continue {
    cursor: pointer;
}
.loading-area.complete {
    opacity: 0;
    transform: translate(-50%, -80%);
}
.loading-track {
    position: relative;
    width: 100%;
    height: 1px;
    background: rgba(255,255,255,.25);
}
.loading-progress {
    position: absolute;
    left: 0;
    top: 0;
    width: 0;
    height: 100%;
    background: #fff;
}
.rocket {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translate(-50%, -50%) rotate(45deg);
    font-size: 20px;
    line-height: 1;
}
#loading-text {
    display: block;
    margin-top: 14px;
    text-align: center;
    font-family: "Paperlogy", sans-serif;
    font-size: 10px;
    letter-spacing: .18em;
    opacity: .65;
}
/* =========================================================
   INTRO STACK
   ========================================================= */

.intro-stack {
    position: absolute;
    left: 50%;
    top: 50%;

    /*
      실제 .screen-card와 가로/세로 크기를 완전히 동일하게 사용한다.
      따라서 화면이 세로로 길면 세로형 카드,
      화면이 가로로 길면 가로형 카드가 자동으로 된다.
    */
    width: calc(100vw - (var(--page-margin) * 2));
    height: calc(100dvh - (var(--page-margin) * 2));
    aspect-ratio: auto;

    transform: translate(-50%, -50%) scale(.78);
    opacity: 0;
    perspective: 1800px;
    transform-style: preserve-3d;
    transition: opacity .9s var(--ease), transform 1.15s var(--ease);
}
.intro-stack.ready {
    opacity: 1;
    transform: translate(-50%, -50%) scale(.95);
}
/* =========================================================
   STACK CARD
   ========================================================= */

.stack-card {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: var(--card-radius);
    background: linear-gradient(145deg, #182233 0%, #090909 58%, #241633 100%);
    border: 0;
    box-shadow: var(--stack-shadow, var(--card-surface-shadow));
    filter: var(--stack-filter, none);
    transform-origin: 50% 92%;
    transition: transform 1.35s var(--ease), opacity .8s var(--ease), filter 1.1s var(--ease), box-shadow 1.1s var(--ease);
    will-change: transform;
}
/*
  stack 내부의 실제 screen-card
*/
.stack-card .screen-card {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    margin: 0;
    border: 0;
    border-radius: 0;
    opacity: 1;
    transform: none;
    z-index: 0;
    box-shadow: none;
    scroll-snap-align: none;
}
/*
  intro stack에서는 요소를 모두 제거하고
  영상/배경만 보이게 한다.
*/
.stack-card .card-content, .stack-card .card-number, .stack-card .circle-action, .stack-card .video-overlay + *, .stack-card .reveal-item {
    visibility: hidden !important;
}
/*
  실제 영상만 표시
*/
.stack-card .card-media {
    position: absolute;
    inset: 0;
    z-index: 1;
}
.stack-card .card-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}
/*
  intro 카드에는 강한 어두운 UI 오버레이를
  적용하지 않는다.
*/
.stack-card .video-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient( 180deg, rgba(0,0,0,.03), rgba(0,0,0,.08) );
}
/*
  카드 자체의 glossy edge
*/
.stack-card:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: inherit;
    padding: 2px;
    background: var(--card-edge-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.08));
}
/* =========================================================
   STACK POSITION
   ========================================================= */

.stack-card-1 {
    z-index: 5;
    --stack-filter: brightness(1) saturate(1);
    --stack-shadow: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(2,6,12,.72), 0 5px 10px rgba(0,0,0,.40), 0 26px 56px rgba(0,0,0,.30);
    transform: translate3d(0, 8px, 40px) rotate(-1.2deg) scale(1);
}
.stack-card-2 {
    z-index: 4;
    --stack-filter: brightness(.92) saturate(.90) blur(.2px);
    --stack-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(2,6,12,.74), 0 4px 8px rgba(0,0,0,.36), 0 18px 38px rgba(0,0,0,.24);
    transform: translate3d(18px, 0, 20px) rotate(-.55deg) scale(.985);
}
.stack-card-3 {
    z-index: 3;
    --stack-filter: brightness(.84) saturate(.80) blur(.45px);
    --stack-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 -1px 0 rgba(2,6,12,.76), 0 3px 7px rgba(0,0,0,.32), 0 13px 28px rgba(0,0,0,.20);
    transform: translate3d(31px, -7px, 0) rotate(0deg) scale(.971);
}
.stack-card-4 {
    z-index: 2;
    --stack-filter: brightness(.76) saturate(.70) blur(.7px);
    --stack-shadow: inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(2,6,12,.78), 0 3px 6px rgba(0,0,0,.28), 0 9px 20px rgba(0,0,0,.16);
    transform: translate3d(40px, -13px, -20px) rotate(.55deg) scale(.960);
}
.stack-card-5 {
    z-index: 1;
    --stack-filter: brightness(.68) saturate(.60) blur(1px);
    --stack-shadow: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(2,6,12,.80), 0 2px 5px rgba(0,0,0,.24), 0 6px 14px rgba(0,0,0,.13);
    transform: translate3d(46px, -18px, -40px) rotate(1.05deg) scale(.952);
}
/* =========================================================
   STACK FLOAT
   ========================================================= */

.intro-stack.ready:not(.spread) {
    animation: introFloat 5.5s ease-in-out infinite;
}
.intro-stack.ready.is-pressed {
    animation-play-state: paused;
    transform: translate(-50%, -50%) scale(.925);
    transition: transform 140ms cubic-bezier(.2,.7,.3,1);
}
@keyframes introFloat {
0%, 100% {
margin-top:0;
}
50% {
margin-top:-8px;
}
}
/* =========================================================
   CARD DROP → RISE
   겹쳐진 카드가 아래로 주르륵 내려갔다가 다시 위로 올라온다.
   ========================================================= */
.intro-stack.spread { animation: none; transform: translate(-50%, -50%) scale(1); }
.intro-stack.spread .stack-card { animation-duration: 1250ms; animation-timing-function: cubic-bezier(.22,.78,.2,1); animation-fill-mode: both; animation-iteration-count: 1; transition:none; }
.intro-stack.spread .stack-card-1 { animation-name:cardDropRise1; animation-delay:0ms; }
.intro-stack.spread .stack-card-2 { animation-name:cardDropRise2; animation-delay:100ms; }
.intro-stack.spread .stack-card-3 { animation-name:cardDropRise3; animation-delay:200ms; }
.intro-stack.spread .stack-card-4 { animation-name:cardDropRise4; animation-delay:300ms; }
.intro-stack.spread .stack-card-5 { animation-name:cardDropRise5; animation-delay:400ms; }
@keyframes cardDropRise1 { 0%{transform:translate3d(0,8px,40px) rotate(-1.2deg) scale(1)} 38%{transform:translate3d(0,calc(78vh + 8px),40px) rotate(-.6deg) scale(1)} 100%{transform:translate3d(0,0,40px) rotate(0) scale(1)} }
@keyframes cardDropRise2 { 0%{transform:translate3d(18px,0,20px) rotate(-.55deg) scale(.985)} 38%{transform:translate3d(18px,78vh,20px) rotate(-.3deg) scale(.985)} 100%{transform:translate3d(0,0,20px) rotate(0) scale(1)} }
@keyframes cardDropRise3 { 0%{transform:translate3d(31px,-7px,0) rotate(0deg) scale(.971)} 38%{transform:translate3d(31px,calc(78vh - 7px),0) rotate(0deg) scale(.971)} 100%{transform:translate3d(0,0,0) rotate(0) scale(1)} }
@keyframes cardDropRise4 { 0%{transform:translate3d(40px,-13px,-20px) rotate(.55deg) scale(.960)} 38%{transform:translate3d(40px,calc(78vh - 13px),-20px) rotate(.3deg) scale(.960)} 100%{transform:translate3d(0,0,-20px) rotate(0) scale(1)} }
@keyframes cardDropRise5 { 0%{transform:translate3d(46px,-18px,-40px) rotate(1.05deg) scale(.952)} 38%{transform:translate3d(46px,calc(78vh - 18px),-40px) rotate(.6deg) scale(.952)} 100%{transform:translate3d(0,0,-40px) rotate(0) scale(1)} }

/* =========================================================
   INTRO PERSON
   ========================================================= */

.intro-person {
    position: absolute;
    z-index: 20;
    left: 50%;
    bottom: max( 13vh, 90px );
    width: 90%;
    text-align: center;
    opacity: 0;
    transform: translate(-50%, 50px);
    transition: opacity .8s var(--ease), transform 1s var(--ease);
}
.intro-person.visible {
    opacity: 1;
    transform: translate(-50%, 0);
}
.intro-person strong {
    display: block;
    font-size: clamp( 34px, 13vw, 70px );
    line-height: 1;
    font-weight: 700;
}
.intro-person span {
    display: block;
    margin-top: 10px;
    font-family: "Paperlogy", sans-serif;
    font-size: clamp(15px, 1.25em, 21px);
    font-weight: 500;
    letter-spacing: .03em;
    opacity: .88;
    text-shadow: 0 2px 12px rgba(0,0,0,.62);
}
.intro-person small {
    display: block;
    margin-top: 14px;
    font-family: "Paperlogy", sans-serif;
    font-size: 9px;
    letter-spacing: .2em;
    opacity: .45;
}
/* =========================================================
   INTRO HINT
   ========================================================= */

.intro-hint {
    position: absolute;
    z-index: 30;
    left: 50%;
    bottom: clamp(34px, 5vh, 52px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
    white-space: nowrap;
    font-family: "Paperlogy", sans-serif;
    font-size: clamp(14px, 1.05em, 18px);
    font-weight: 600;
    letter-spacing: .04em;
    text-shadow: 0 2px 12px rgba(0,0,0,.68);
    opacity: 0;
    transition: opacity .6s ease;
}
.intro-hint.visible {
    opacity: .84;
}
.intro-hint i {
    display: block;
    width: 28px;
    height: 1px;
    background: #fff;
    animation: hintLine 1.4s ease-in-out infinite;
}
@keyframes hintLine {
0%, 100% {
transform:scaleX(.4);
opacity:.3;
}
50% {
transform:scaleX(1);
opacity:1;
}
}
/* =========================================================
   MORPH LAYER
   ========================================================= */

/*
  실제 첫 카드로 넘어가는 순간
  stack의 01번 카드가 이 layer로 이동한다.
*/
.morph-layer {
    position: fixed;
    z-index: 2500;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
    border-radius: var(--card-radius);
    background: #090909;
    transform-origin: top left;
    will-change: left, top, width, height, transform, opacity;
}
.morph-layer.active {
    opacity: 1;
}
.morph-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
/*
  실제 카드로 연결될 때
  살짝 어두운 layer
*/
.morph-layer:after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient( 180deg, rgba(0,0,0,.04), rgba(0,0,0,.20) );
}
/* =========================================================
   MAIN
   ========================================================= */

#main {
    position: relative;
    z-index: 10;
    width: 100%;
    min-height: 100svh;
    height: 100dvh;
    padding: 0;
    overflow: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
    touch-action: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .7s ease, visibility .7s;
}
#main.active {
    opacity: 1;
    visibility: visible;
}
#main.initial-reveal {
    opacity: 1;
    visibility: visible;
    transition: none;
}
#main::-webkit-scrollbar {
display:none;
}
/* =========================================================
   SCREEN CARD
   ========================================================= */

.screen-card {
    position: absolute;
    inset: var(--page-margin);
    width: auto;
    height: auto;
    min-height: 0;
    margin: 0;
    overflow: hidden;
    border-radius: var(--card-radius);
    background: linear-gradient(145deg, #182233 0%, #090909 58%, #241633 100%);
    border: 0;
    transform: perspective(1200px) translate3d(var(--deck-x, 0px), var(--deck-y, 18px), 0) rotateX(var(--float-rotate-x, 0deg)) rotateY(var(--float-rotate-y, 0deg)) rotate(var(--deck-rotate, 0deg)) scale(var(--deck-scale, .96));
    opacity: var(--deck-opacity, 0);
    z-index: var(--deck-z, 1);
    box-shadow: var(--deck-shadow, var(--card-surface-shadow));
    filter: var(--deck-filter, none);
    transition: transform .82s cubic-bezier(.16,1,.3,1), opacity .68s ease, filter .82s ease;
    will-change: transform, opacity;
    container-type: size;
    isolation: isolate;
}
.screen-card.is-dragging {
    transition: none;
}
/* The reading state is a single floating card. The intro stack keeps its
   separate multi-card motion, while deck gestures temporarily pause drift. */
#main.active:not(.is-deck-busy) > .screen-card.is-active {
    animation: cardDrift 9.6s ease-in-out 450ms infinite;
}
@keyframes cardDrift {
    0%, 100% {
        translate: 0 0;
        --float-rotate-x: 0deg;
        --float-rotate-y: 0deg;
        --float-light-x: 50%;
        --float-light-y: 42%;
        --float-chroma: .01;
    }
    18% {
        translate: -2px -3px;
        --float-rotate-x: .85deg;
        --float-rotate-y: -1.15deg;
        --float-light-x: 62%;
        --float-light-y: 56%;
        --float-chroma: .07;
    }
    39% {
        translate: 1px -4px;
        --float-rotate-x: 1.2deg;
        --float-rotate-y: .55deg;
        --float-light-x: 43%;
        --float-light-y: 64%;
        --float-chroma: .05;
    }
    61% {
        translate: 2.5px 1px;
        --float-rotate-x: -.65deg;
        --float-rotate-y: 1.25deg;
        --float-light-x: 34%;
        --float-light-y: 40%;
        --float-chroma: .075;
    }
    81% {
        translate: -1px 3px;
        --float-rotate-x: -1.1deg;
        --float-rotate-y: -.45deg;
        --float-light-x: 58%;
        --float-light-y: 31%;
        --float-chroma: .055;
    }
}
/* Keep the edge above custom media without covering or intercepting controls. */
#main > .screen-card:before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 30;
    border-radius: inherit;
    padding: 2px;
    background: var(--card-edge-gradient);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
    filter:
        drop-shadow(-.45px 0 rgba(76,224,235,var(--float-chroma)))
        drop-shadow(.45px 0 rgba(175,104,255,var(--float-chroma)));
}
#main > .screen-card:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 31;
    border-radius: inherit;
    padding: 2px;
    background: linear-gradient(115deg, transparent 38%, rgba(232,242,255,.65) 49%, transparent 60%) 100% 50% / 300% 100%;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    opacity: 0;
    pointer-events: none;
}
#main > .screen-card.is-edge-reflecting:after {
    animation: card-edge-reflection .6s ease-out both;
}
@keyframes card-edge-reflection {
    0% { background-position: 100% 50%; opacity: 0; }
    25% { opacity: .8; }
    100% { background-position: 0% 50%; opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
    #main > .screen-card.is-edge-reflecting:after { animation: none; }
    #main.active > .screen-card.is-active { animation: none; }
}
.screen-card.is-wheel-scrubbing {
    transition: transform .22s cubic-bezier(.22,.82,.25,1), opacity .22s ease, filter .22s ease;
}
/* =========================================================
   CARD MEDIA
   ========================================================= */

.card-media {
    position: absolute;
    inset: 0;
    z-index: -3;
    overflow: hidden;
    background: linear-gradient(145deg, #182233 0%, #090909 58%, #241633 100%);
}
.card-media:before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
        radial-gradient(circle at var(--float-light-x) var(--float-light-y), rgba(255,255,255,.115) 0%, rgba(150,224,238,.052) 13%, transparent 34%),
        linear-gradient(108deg, rgba(255,255,255,.065) 0%, transparent 15%, transparent 72%, rgba(92,205,219,.05) 100%),
        repeating-linear-gradient(115deg, rgba(255,255,255,.016) 0 1px, transparent 1px 4px);
    mix-blend-mode: overlay;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.07),
        inset 0 0 22px rgba(110,200,220,.035),
        inset 0 -16px 30px rgba(0,0,0,.07);
}
.card-media:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: .04;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");
    background-size: 132px 132px;
}
.card-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    background: transparent;
}
.video-overlay {
    position: absolute;
    inset: 0;
    z-index: -2;
    background: linear-gradient( 180deg, rgba(0,0,0,.06), rgba(0,0,0,.12) 45%, rgba(0,0,0,.76) 100% );
    pointer-events: none;
}
.screen-card:after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient( circle at 50% 50%, transparent 15%, rgba(0,0,0,.26) 100% );
    pointer-events: none;
}
/* =========================================================
   CARD NUMBER
   ========================================================= */

.card-number {
    position: absolute;
    z-index: 10;
    top: 24px;
    right: 22px;
    font-family: "Paperlogy", sans-serif;
    font-size: 10px;
    letter-spacing: .2em;
    opacity: .55;
	visibility: hidden;
}
/* =========================================================
   CARD CONTENT
   ========================================================= */

.card-content {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 30px 24px 35px;
    display: flex;
}
.reveal-item {
    opacity: 0;
    transform: translateY(35px) scale(.98);
    transition: opacity .9s var(--ease), transform 1s var(--ease);
}
.screen-card.is-active .reveal-item {
    opacity: 1;
    transform: translateY(0) scale(1);
}
.links-card.is-active .reveal-item {
    transition: none;
    opacity: 1;
    transform: translateY(0) scale(1);
}
.profile-card.is-active .reveal-item {
    transition: none;
    opacity: 1;
    transform: translateY(0) scale(1);
}
.profile-card .reveal-item {
    transition: none;
    opacity: 1;
    transform: translateY(0) scale(1);
}
/* Sweep the front of the intro stack once it has appeared. */
.stack-card-1:before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(190,210,255,.04) 42%, rgba(255,255,255,.14) 50%, rgba(190,210,255,.04) 58%, transparent 70%);
    transform: translate3d(-120%, 0, 0);
}
.intro-stack.ready .stack-card-1:before {
    animation: cardLightSweep 1100ms var(--ease-soft) 900ms backwards;
}
/* Reveal identity text once per card, after the intro has cleared. */
.profile-card.has-entered .profile-name h1 {
    animation: profileTitleEntrance 620ms var(--ease-soft) 80ms backwards;
}
.profile-card.has-entered .profile-name p {
    animation: profileMetaEntrance 620ms var(--ease-soft) 180ms backwards;
}
.role-card.has-entered .role-text {
    animation: identityEntrance 620ms var(--ease-soft) 80ms backwards;
}
.profile-card.has-entered .profile-name p {
    animation-delay: 180ms;
}
.role-card .role-text.reveal-item {
    opacity: 1;
    transform: none;
    transition: none;
}
@keyframes cardLightSweep {
    0% { opacity: 0; transform: translate3d(-120%, 0, 0); }
    20%, 65% { opacity: 1; }
    100% { opacity: 0; transform: translate3d(120%, 0, 0); }
}
@keyframes identityEntrance {
    from { opacity: 0; }
    to { opacity: 1; }
}
@keyframes profileTitleEntrance {
    from {
        opacity: 0;
        text-shadow: 0 0 28px rgba(130,226,255,.72), 0 0 9px rgba(185,123,255,.48), 0 2px 12px rgba(0,0,0,.18);
    }
    55% {
        text-shadow: 0 0 14px rgba(130,226,255,.28), 0 0 5px rgba(185,123,255,.18), 0 2px 12px rgba(0,0,0,.30);
    }
    to {
        opacity: 1;
        text-shadow: 0 2px 12px rgba(0,0,0,.38);
    }
}
@keyframes profileMetaEntrance {
    from {
        opacity: 0;
        text-shadow: 0 0 18px rgba(130,226,255,.58), 0 0 7px rgba(185,123,255,.34), 0 2px 12px rgba(0,0,0,.18);
    }
    to {
        opacity: .82;
        text-shadow: 0 2px 12px rgba(0,0,0,.38);
    }
}
/* =========================================================
   PROFILE
   ========================================================= */

.profile-content {
    align-items: flex-end;
}
.profile-name {
    position: relative;
    z-index: 0;
    isolation: isolate;
    margin-bottom: 8vh;
}
.profile-name:before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -34px -28px -26px;
    pointer-events: none;
    background: radial-gradient(ellipse at 28% 55%, rgba(3,7,14,.56), rgba(3,7,14,.18) 48%, transparent 72%);
    filter: blur(8px);
}
.profile-name h1 {
    font-family: "Pretendard", sans-serif;
    font-size: clamp( 46px, 13vw, 90px );
    line-height: .9;
    font-weight: 800;
    letter-spacing: -.055em;
    text-shadow: 0 2px 12px rgba(0,0,0,.38);
}
.profile-name p {
    margin-top: 10px;
    font-family: "Paperlogy", sans-serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: .08em;
    opacity: .82;
    text-shadow: 0 2px 12px rgba(0,0,0,.38);
}
/* =========================================================
   CIRCLE ACTION
   ========================================================= */

.circle-action {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
    position: absolute;
    right: 20px;
    bottom: 25px;
    z-index: 20;
    width: 58px;
    height: 58px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(var(--blur));
    -webkit-backdrop-filter: blur(var(--blur));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 15px 40px rgba(0,0,0,.3);
    transition: transform .35s var(--ease), background .35s ease;
}
.circle-action:hover {
    background: rgba(255,255,255,.18);
}
.circle-action svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: #fff;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* =========================================================
   HEART
   ========================================================= */

.floating-heart {
    position: fixed;
    z-index: 9999;
    display: block;
    pointer-events: none;
    user-select: none;
    font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    font-size: clamp(48px, 12vw, 84px);
    line-height: 1.2;
    opacity: 0;
    transform: translate3d(-50%, -50%, 0) scale(.2);
    will-change: transform, opacity;
}
.floating-heart.is-active {
    animation: heartPop 1250ms ease-out forwards;
}
@keyframes heartPop {
  0% { opacity: 0; transform: translate3d(-50%, -50%, 0) scale(.2) rotate(-14deg); }
  18% { opacity: 1; transform: translate3d(-50%, -65%, 0) scale(1.2, .9) rotate(10deg); }
  32% { opacity: 1; transform: translate3d(-50%, -55%, 0) scale(.94, 1.08) rotate(-7deg); }
  48% { opacity: 1; transform: translate3d(-50%, -70%, 0) scale(1) rotate(5deg); }
  72% { opacity: 1; transform: translate3d(calc(-50% + var(--x) * .5), calc(-50% + var(--y) * .5), 0) scale(1) rotate(-4deg); }
  100% { opacity: 0; transform: translate3d(calc(-50% + var(--x)), calc(-50% + var(--y)), 0) scale(.7) rotate(var(--tilt)); }
}
@media (prefers-reduced-motion: reduce) {
  .floating-heart.is-active { animation: heartFade 500ms ease-out forwards; }
  @keyframes heartFade {
    0%, 100% { opacity: 0; transform: translate(-50%, -50%); }
    25%, 75% { opacity: 1; transform: translate(-50%, -50%); }
  }
}

/* =========================================================
   ROLE
   ========================================================= */

.role-content {
    align-items: center;
}
.role-text {
    width: min( 100%);
}
.eyebrow {
    display: block;
    margin-bottom: 13px;
    font-family: "Paperlogy", sans-serif;
    font-size: 1em;
    letter-spacing: .1em;
    opacity: 1;
}
.role-text h2 {
    max-width: 100%;
    font-family: "Pretendard", sans-serif;
    font-size: clamp( 46px, 13vw, 90px );
    line-height: .95;
    font-weight: 700;
    letter-spacing: -.07em;
    word-wrap: normal;
}
.role-list {
    margin-top: 35px;
    list-style: none;
}
.role-list li {
 padding: 1em 0;
    border-top: 1px dotted rgba(255, 255, 255, .18);
    font-family: "Pretendard", sans-serif;
    font-size: 1.2em;
    opacity: .75;
}
.role-list li:last-child {
    border-bottom: 1px solid rgba(255,255,255,.18);
}
/* =========================================================
   CONTACT
   ========================================================= */

.contact-content {
    align-items: center;
}
.phone-number {
    display: block;
    width: 100%;
    font-family: "pretendard", sans-serif;
    /* Scale from the card container so small previews never overflow. */
    font-size: clamp(64px, 34cqw, 136px);
    line-height: .95;
    letter-spacing: -.065em;
    white-space: pre-line;
    font-weight: 200;
}
.phone-number:active {
    opacity: .5;
}
.contact-details {
    position: absolute;
    left: 24px;
    bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 13px;
}
.contact-link {
    width: fit-content;
    text-align: left;
    font-family: "Paperlogy", sans-serif;
    font-size: 1em;
    letter-spacing: .04em;
    opacity: .65;
    transition: opacity .3s ease;
}
.contact-link:hover {
    opacity: 1;
}
/* =========================================================
   COMPANY
   ========================================================= */

.company-content {
    align-items: center;
    justify-content: center;
    text-align: center;
}
.company-inner {
     display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: clamp(14px, 3cqh, 28px);
}
.company-logo {
    width: min(80cqw, 320px);
    max-width: 80%;
    max-height: 18cqh;
    object-fit: contain;
}
.slogan {
display: flex;
    flex-direction: column;
    gap: 5px;
    max-width: 90%;
    margin-top: clamp(12px, 3cqh, 30px);
    font-family: "Paperlogy", sans-serif;
    font-size: clamp(15px, 5cqw, 22px);
    line-height: 1.25;
    letter-spacing: -.02em;
    opacity: 1;
}
/* =========================================================
   LINKS
   ========================================================= */

.links-content {
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    gap: 34px;
}
.qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
}
.qr-code {
    width: 180px;
    height: 180px;
    padding: 10px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 25px 60px rgba(0,0,0,.45);
}
.qr-code img, .qr-code canvas {
    width: 100%!important;
    height: 100%!important;
}
.qr-wrap>span {
    font-family: "Paperlogy", sans-serif;
    font-size: 1em;
    letter-spacing: 0;
    opacity: 1;
}
.link-actions {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.large-action {
    width: 100%;
    min-height: 54px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 13px;
    border-radius: 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.13);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-family: "Pretendard", sans-serif;
    font-size: 1em;
    transition: background .3s ease, transform .3s var(--ease);
}
.large-action:hover {
    background: rgba(255,255,255,.14);
}
.action-icon {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
}
.action-icon svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: #fff;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
}
/* =========================================================
   NAVIGATION
   ========================================================= */

.card-navigation {
    position: fixed;
    z-index: 3000;
    right: max( 18px, env(safe-area-inset-right) );
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 11px;
}
.nav-dot {
    position: relative;
    width: 7px;
    height: 7px;
    padding: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.3);
    transition: transform .4s var(--ease), background .4s ease;
}
.nav-dot:after {
    content: "";
    position: absolute;
    inset: -7px;
    border: 1px solid transparent;
    border-radius: 50%;
    transition: border-color .4s ease;
}
.nav-dot.active {
    background: #fff;
    transform: scale(1.35);
}
.nav-dot.active:after {
    border-color: rgba(255,255,255,.4);
}
/* =========================================================
   TOAST
   ========================================================= */

.toast {
    position: fixed;
    z-index: 5000;
    left: 50%;
    bottom: 35px;
    padding: 24px 18px;
    border-radius: 100px;
    background: rgba(20,20,20,.78);
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    font-family: "Pretendard", sans-serif;
    font-size: 11px;
    opacity: 0;
    transform: translate(-50%, 20px);
    pointer-events: none;
    transition: opacity .4s ease, transform .4s var(--ease);
}
.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}
/* =========================================================
   MODAL
   ========================================================= */

.modal {
    position: fixed;
    inset: 0;
    z-index: 6000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s ease, visibility .4s;
}
.modal.open {
    opacity: 1;
    visibility: visible;
}
.modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.65);
    backdrop-filter: blur(10px);
}
.modal-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    padding: 30px 22px 22px;
    border-radius: 25px 25px 15px 15px;
    background: linear-gradient( 145deg, rgba(40,40,40,.85), rgba(10,10,10,.92) );
    border: 1px solid rgba(255,255,255,.14);
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
    transform: translateY(50px);
    transition: transform .6s var(--ease);
}
.modal.open .modal-card {
    transform: translateY(0);
}
.modal-close {
    position: absolute;
    top: 24px;
    right: 18px;
    font-size: 28px;
    opacity: .5;
}
.modal-eyebrow {
    font-family: "Paperlogy", sans-serif;
    font-size: 9px;
    letter-spacing: .2em;
    opacity: .45;
}
.modal-card h3 {
    margin-top: 8px;
    font-family: "Pretendard", sans-serif;
    font-size: 25px;
    letter-spacing: -.04em;
}
.address {
    margin-top: 13px;
    font-size: 24px;
    line-height: 1.7;
    opacity: .65;
}
.map-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}
.map-buttons button {
    min-height: 65px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 0 16px;
    border-radius: 13px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.13);
}
.map-buttons button span {
    font-size: 13px;
}
.map-buttons button small {
    margin-top: 4px;
    font-family: "Paperlogy", sans-serif;
    font-size: 9px;
    opacity: .45;
}

/* =========================================================
   CARD TYPE SCALE
   iPhone 16 Pro Max card width (400px) is the 1x reference.
   cqw keeps the type proportional to the actual card, not the browser UI.
   ========================================================= */

.screen-card .profile-name h1,
.screen-card .role-text h2 {
    font-size: clamp(46px, 14.3cqw, 90px);
}

.screen-card .profile-name p {
    font-size: clamp(18px, 6cqw, 24px);
}

.screen-card .eyebrow {
    font-size: clamp(12px, 4cqw, 16px);
}

.screen-card .role-list li {
    font-size: clamp(15px, 4.8cqw, 19.2px);
}

.screen-card .contact-link,
.screen-card .qr-wrap > span,
.screen-card .large-action {
    font-size: clamp(13px, 4cqw, 16px);
}

.screen-card .slogan {
    font-size: clamp(17px, 5.6cqw, 22.4px);
}

/* =========================================================
   DESKTOP

min( 38vw, 560px );

/* Local press feedback; scale stays independent of card reveal transforms. */
#main :is(.circle-action, .large-action, .contact-link),

/* =========================================================

<script>
(() => {

"use strict";

/* =========================================================
   CONFIG
   ========================================================= */

const CONFIG = {

  stackRevealDelay:
    350,

  personDelay:
    900,

  hintDelay:
    1700,

  spreadDuration:
    1700,

  morphDuration:
    1100,

  toastDuration:
    1800

};


/* =========================================================
   DOM
   ========================================================= */

const DOM = {

  intro:
    document.querySelector("#intro"),

  introStack:
    document.querySelector("#intro-stack"),

  introPerson:
    document.querySelector("#intro-person"),

  introHint:
    document.querySelector("#intro-hint"),

  loadingArea:
    document.querySelector(".loading-area"),

  videoStartGate:
    document.querySelector("#video-start-gate"),

  loadingProgress:
    document.querySelector("#loading-progress"),

  loadingText:
    document.querySelector("#loading-text"),

  rocket:
    document.querySelector("#rocket"),

  main:
    document.querySelector("#main"),

  cards:
    document.querySelectorAll(".screen-card"),

  stackCards:
    document.querySelectorAll(".stack-card"),

  morphLayer:
    document.querySelector("#morph-layer"),

  morphVideo:
    document.querySelector("#morph-video"),

  logoButton:
    document.querySelector("#logo-button"),

  navDots:
    document.querySelectorAll(".nav-dot"),

  heartButton:
    document.querySelector("#heart-button"),

  languageButton:
    document.querySelector("#language-button"),

  homeButton:
    document.querySelector("#home-button"),

  shareButton:
    document.querySelector("#share-button"),

  directionButton:
    document.querySelector("#direction-button"),

  toast:
    document.querySelector("#toast"),

  mapModal:
    document.querySelector("#map-modal"),

  modalClose:
    document.querySelector("#modal-close"),

  kakaoMap:
    document.querySelector("#kakao-map"),

  naverMap:
    document.querySelector("#naver-map"),

  qrCode:
    document.querySelector("#qr-code")

};


/* =========================================================
   STATE
   ========================================================= */

const state = {

  introComplete:
    false,

  spread:
    false,

  morphing:
    false,

  currentCard:
    0,

  language:
    "ko",

  toastTimer:
    null,

  touchStartY:
    0,

  deckDragging:
    false,

  deckStartY:
    0,

  deckOffsetY:
    0,

  deckPointerId:
    null,

  deckAnimating:
    false,

  deckWheelScrubbing:
    false,

  deckWheelResetTimer:
    null,

  deckWheelLocked:
    false,

  deckWheelUnlockTimer:
    null,

  deckBoundaryTimer:
    null,

  videoApproved:
    false,

  loadingVideos:
    [],

  loadingFrame:
    null,

  loadingComplete:
    false,

  loadingContinueStarted:
    false

};


/* =========================================================
   INIT
   ========================================================= */

function init(){

  try{
    createIntroCards();
  }catch(e){}

  try{
    bindEvents();
  }catch(e){}

  try{
    prepareVideos();
  }catch(e){}

  try{
    setupLoadingVideoTracking();
  }catch(e){}

  if (CONFIG.skipIntro) {
    enterMainFallback();
  } else {
    setupVideoStartGate();
  }

  createQRCode();

  setupDeck();

}


/* =========================================================
   CREATE INTRO CARDS
   ========================================================= */

function createIntroCards(){

  DOM.stackCards.forEach(
    (stack,index) => {

      const source =
        DOM.cards[index];

      if(!source){
        return;
      }

      /*
        실제 카드를 그대로 복제
      */

      const clone =
        source.cloneNode(true);

      clone.classList.add(
        "intro-preview-card"
      );


      /*
        intro에서는 UI 요소를 숨긴다.
      */

      stack.innerHTML =
        "";

      stack.appendChild(
        clone
      );


      /*
        영상 준비
      */

      const sourceVideo =
        source.querySelector(
          ".card-video"
        );

      const previewVideo =
        clone.querySelector(
          ".card-video"
        );


      if(
        sourceVideo &&
        previewVideo
      ){

        const sourceElement =
          sourceVideo.querySelector(
            "source"
          );

        const videoUrl =
          sourceElement?.getAttribute("src") ||
          sourceVideo.getAttribute("src") ||
          sourceVideo.currentSrc ||
          "";

        if(videoUrl){
          previewVideo.removeAttribute("src");

          const previewSource =
            previewVideo.querySelector(
              "source"
            );

          if(previewSource){
            previewSource.setAttribute(
              "src",
              videoUrl
            );

            previewSource.setAttribute(
              "type",
              sourceElement?.getAttribute("type") ||
              "video/mp4"
            );
          }else{
            previewVideo.src =
              videoUrl;
          }
        }

        previewVideo.muted =
          true;

        previewVideo.loop =
          true;

        previewVideo.playsInline =
          true;

        previewVideo.setAttribute(
          "muted",
          ""
        );

        previewVideo.setAttribute(
          "playsinline",
          ""
        );

        previewVideo.setAttribute(
          "webkit-playsinline",
          ""
        );

        previewVideo.setAttribute(
          "preload",
          "auto"
        );

        try{
          previewVideo.load();
        }catch(e){}

        previewVideo.currentTime =
          0;

        previewVideo.play().catch(
          () => {}
        );

      }

      /*
        intro 안에서는 버튼 / 링크 비활성화
      */

      clone
        .querySelectorAll(
          "button,a"
        )
        .forEach(
          element => {

            element.setAttribute(
              "tabindex",
              "-1"
            );

            element.setAttribute(
              "aria-hidden",
              "true"
            );

          }
        );

    }
  );

}


/* =========================================================
   PREPARE VIDEOS
   ========================================================= */

function prepareVideos(){

  DOM.cards.forEach(
    (card,index) => {

      const video = card.querySelector(".card-video");

      if(!video){
        return;
      }

      video.muted =
        true;

      video.defaultMuted =
        true;

      video.autoplay =
        false;

      video.playsInline =
        true;

      video.setAttribute(
        "muted",
        ""
      );

      video.removeAttribute("autoplay");

      video.setAttribute(
        "playsinline",
        ""
      );

      video.setAttribute(
        "webkit-playsinline",
        ""
      );

      video.preload = index === 0 ? "auto" : "metadata";

      video.addEventListener(
        "canplay",
        () => {
          if(
            state.videoApproved &&
            index === state.currentCard &&
            !document.hidden
          ){
            playCardVideo(video);
          }
        },
        {passive:true}
      );


      try{

        if(index === 0 && video.readyState === 0){
          video.load();
        }

      }catch(e){}

      if(index !== 0){
        video.pause();
      }
    }
  );

}


function playCardVideo(video){

  if(!video){
    return;
  }

  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.setAttribute("muted", "");
  video.setAttribute("playsinline", "");
  video.setAttribute("webkit-playsinline", "");

  try{
    const playback = video.play();
    if(playback && typeof playback.catch === "function"){
      playback.catch(() => {});
    }
  }catch(e){}

}


function syncCardVideos(activeIndex){

  DOM.cards.forEach(
    (card,index) => {

      const video = card.querySelector(".card-video");

      if(!video){
        return;
      }

      if(index === activeIndex && !document.hidden){
        video.preload = "auto";
        playCardVideo(video);
      }else{
        video.pause();
      }

    }
  );

}


/* =========================================================
   VIDEO START GATE
   ========================================================= */

function setupVideoStartGate(){

  if(
    !DOM.videoStartGate
  ){
    return;
  }


  const approveAndStart =
    () => {

      if(
        state.videoApproved
      ){
        return;
      }


      state.videoApproved =
        true;


      /*
        시작 버튼은 즉시 숨긴다.
      */

      DOM.videoStartGate.classList.add(
        "is-hidden"
      );

      DOM.videoStartGate.setAttribute(
        "aria-hidden",
        "true"
      );


      forceAutoplayAllVideos();


      /*
        버튼이 사라진 프레임을 확보한 후

      */

      requestAnimationFrame(
        () => {

          DOM.loadingArea.classList.add(
            "started"
          );

          startIntro();

        }
      );

    };


  DOM.videoStartGate.addEventListener(
    "click",
    approveAndStart

  DOM.videoStartGate.addEventListener(
    "pointerup",
    approveAndStart,
    {
      passive:true
    }
  );

  DOM.videoStartGate.onclick =
    approveAndStart;


  DOM.videoStartGate.addEventListener(
    "touchend",
    approveAndStart,
    {
      passive:true
    }
  );

}
