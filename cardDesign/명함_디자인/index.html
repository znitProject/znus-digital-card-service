/* =========================================================
   BIND EVENTS
   ========================================================= */

function bindEvents(){


  /* -------------------------------------------------------
     LOGO
  ------------------------------------------------------- */

  if(DOM.logoButton){

    DOM.logoButton.addEventListener(
      "click",
      () => {
        window.location.reload();
      }
    );

  }


  /* -------------------------------------------------------
     INTRO
     로딩 완료 후 화면 아무 곳이나 터치하면 펼침
  ------------------------------------------------------- */

  document.addEventListener(
    "pointerdown",
    event => {

      if(
        state.introComplete ||
        state.morphing ||
        state.spread
      ){
        return;
      }


      if(
        !DOM.introStack.classList.contains(
          "ready"
        )
      ){
        if(
          state.loadingComplete &&
          !state.loadingContinueStarted
        ){
          continueAfterLoading();
        }

        return;
      }


      /*
        시작 버튼 / 링크 / 버튼류를
        실수로 펼침 동작으로 처리하지 않는다.
      */

      if(
        event.target.closest(
          "button, a"
        )
      ){
        return;
      }


      handleIntroInteraction();

    },
    {
      passive:true
    }
  );


  /* -------------------------------------------------------
     NAV
  ------------------------------------------------------- */

  DOM.navDots.forEach(
    dot => {

      dot.addEventListener(
        "click",
        () => {

          goToCard(
            Number(
              dot.dataset.target
            )
          );

        }
      );

    }
  );


  /* -------------------------------------------------------
     HEART
     한 번 클릭 = 하트 하나
  ------------------------------------------------------- */

  if(
    DOM.heartButton
  ){

    let lastTouchTime =
      0;


    const handleTouch =
      event => {

        event.preventDefault();
        event.stopPropagation();

        lastTouchTime =
          Date.now();

        createHeartBurst(
          event
        );

      };


    const handleClick =
      event => {

        event.stopPropagation();


        /*
          iOS에서 touchend 후 click이
          중복으로 발생하는 것을 방지
        */

        if(
          Date.now() -
          lastTouchTime <
          500
        ){
          return;
        }


        createHeartBurst(
          event
        );

      };


    DOM.heartButton.addEventListener(
      "touchend",
      handleTouch,
      {
        passive:false
      }
    );


    DOM.heartButton.addEventListener(
      "click",
      handleClick
    );

  }


  /* -------------------------------------------------------
     LANGUAGE
  ------------------------------------------------------- */

  if(
    DOM.languageButton
  ){

    DOM.languageButton.addEventListener(
      "click",
      toggleLanguage
    );

  }


  /* -------------------------------------------------------
     HOME
  ------------------------------------------------------- */

  if(
    DOM.homeButton
  ){

    DOM.homeButton.addEventListener(
      "click",
      () => {

        const website = window.__ZNUS_CARD__?.companyWebsite?.trim();
        if(!website){
          showToast("회사 홈페이지가 등록되지 않았습니다");
          return;
        }
        window.open(website, "_blank", "noopener,noreferrer");

      }
    );

  }


  /* -------------------------------------------------------
     COPY
  ------------------------------------------------------- */

  document
    .querySelectorAll(
      "[data-copy]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            await copyToClipboard(
              button.dataset.copy
            );


            showToast(
              button.dataset.copy
                .includes("@")
                ? "주소가 복사되었습니다"
                : "번호가 복사되었습니다"
            );

          }
        );

      }
    );


  /* -------------------------------------------------------
     SHARE
  ------------------------------------------------------- */

  if(
    DOM.shareButton
  ){

    DOM.shareButton.addEventListener(
      "click",
      shareProfile
    );

  }


  /* -------------------------------------------------------
     MAP
  ------------------------------------------------------- */

  if(
    DOM.directionButton
  ){

    DOM.directionButton.addEventListener(
      "click",
      openMapModal
    );

  }


  if(
    DOM.modalClose
  ){

    DOM.modalClose.addEventListener(
      "click",
      closeMapModal
    );

  }


  const modalBackdrop =
    DOM.mapModal?.querySelector(
      ".modal-backdrop"
    );


  if(
    modalBackdrop
  ){

    modalBackdrop.addEventListener(
      "click",
      closeMapModal
    );

  }


  if(
    DOM.kakaoMap
  ){

    DOM.kakaoMap.addEventListener(
      "click",
      openKakaoMap
    );

  }


  if(
    DOM.naverMap
  ){

    DOM.naverMap.addEventListener(
      "click",
      openNaverMap
    );

  }


  /* -------------------------------------------------------
     ESC
  ------------------------------------------------------- */

  window.addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Escape"
      ){

        closeMapModal();

      }

    }
  );


  /* -------------------------------------------------------
     CARD DECK DRAG
  ------------------------------------------------------- */

  if(DOM.main){

    const isInteractiveTarget = target => target.closest(
      "button, a, input, textarea, select, option"
    );

    DOM.main.addEventListener("pointerdown", event => {

      if(
        !state.introComplete ||
        state.morphing ||
        state.deckAnimating ||
        state.deckWheelLocked ||
        state.deckWheelScrubbing ||
        event.button > 0 ||
        isInteractiveTarget(event.target)
      ){
        return;
      }

      state.deckDragging = true;
      state.deckPointerId = event.pointerId;
      state.deckStartY = event.clientY;
      state.deckOffsetY = 0;

      try{
        DOM.main.setPointerCapture(event.pointerId);
      }catch(e){}

      renderDeck();

    }, {passive:true});

    DOM.main.addEventListener("pointermove", event => {

      if(
        !state.deckDragging ||
        event.pointerId !== state.deckPointerId
      ){
        return;
      }

      event.preventDefault();
      const maxDrag = Math.max(DOM.main.clientHeight * .92, 240);
      state.deckOffsetY = clampDeck(
        event.clientY - state.deckStartY,
        -maxDrag,
        maxDrag
      );
      renderDeck();

    }, {passive:false});

    const finishDeckDrag = event => {

      if(
        !state.deckDragging ||
        event.pointerId !== state.deckPointerId
      ){
        return;
      }

      const offset = state.deckOffsetY;
      const threshold = Math.max(DOM.main.clientHeight * .16, 70);
      const target = offset < -threshold
        ? state.currentCard + 1
        : offset > threshold
          ? state.currentCard - 1
          : state.currentCard;

      state.deckDragging = false;
      state.deckOffsetY = 0;

      try{
        DOM.main.releasePointerCapture(event.pointerId);
      }catch(e){}

      if(target !== state.currentCard){
        if(target >= 0 && target < DOM.cards.length){
          animateDeckTo(target);
        }else{
          bounceDeckBoundary(offset < 0 ? -1 : 1);
        }
      }else{
        renderDeck();
      }

    };

    DOM.main.addEventListener("pointerup", finishDeckDrag, {passive:true});
    DOM.main.addEventListener("pointercancel", finishDeckDrag, {passive:true});

    // One gesture consumes one card. Ignore its momentum until input is quiet.
    let wheelTotal = 0;
    let wheelConsumed = false;
    let wheelIdleTimer = null;

    DOM.main.addEventListener("wheel", event => {
      if(!state.introComplete || event.ctrlKey || Math.abs(event.deltaX) > Math.abs(event.deltaY)){
        return;
      }
      event.preventDefault();
      if(!event.deltaY){ return; }

      window.clearTimeout(wheelIdleTimer);
      wheelIdleTimer = window.setTimeout(() => {
        wheelTotal = 0;
        wheelConsumed = false;
        wheelIdleTimer = null;
      }, 160);

      if(wheelConsumed || state.deckAnimating || state.deckDragging || state.deckWheelLocked){
        // Inputs during a transition must not become a queued next-card action.
        wheelConsumed = true;
        return;
      }

      const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? DOM.main.clientHeight : 1;
      const delta = event.deltaY * unit;
      if(wheelTotal && Math.sign(wheelTotal) !== Math.sign(delta)){
        wheelTotal = 0;
      }
      wheelTotal += delta;
      if(Math.abs(wheelTotal) < 24){ return; }

      wheelConsumed = true;
      const target = state.currentCard + (wheelTotal > 0 ? 1 : -1);
      wheelTotal = 0;
      if(target >= 0 && target < DOM.cards.length){
        animateDeckTo(target, {source:"wheel"});
      }
    }, {passive:false});

  }

}


/* =========================================================
   INTRO LOADING
   ========================================================= */

function getLoadingVideos(){

  return [
    ...DOM.introStack.querySelectorAll(
      ".intro-preview-card .card-video"
    )
  ].filter(
    video =>
      video.currentSrc ||
      video.src ||
      video.querySelector("source")?.src
  );

}


function getVideoLoadProgress(video){

  if(video.error){
    return 0;
  }

  if(video.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA){
    return 1;
  }

  const duration = video.duration;
  if(
    Number.isFinite(duration) &&
    duration > 0 &&
    video.buffered.length
  ){
    const bufferedEnd = video.buffered.end(
      video.buffered.length - 1
    );

    return Math.min(
      bufferedEnd / duration,
      .98
    );
  }

  if(video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA){
    return .9;
  }

  if(video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA){
    return .55;
  }

  if(video.readyState >= HTMLMediaElement.HAVE_METADATA){
    return .2;
  }

  return 0;

}


function areLoadingVideosReady(){

  return state.loadingVideos.length === 0 ||
    state.loadingVideos.every(
      video =>
        !video.error &&
        video.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA
    );

}


function renderLoadingProgress(){

  const videos = state.loadingVideos;
  const progress = videos.length
    ? videos.reduce(
      (total, video) => total + getVideoLoadProgress(video),
      0
    ) / videos.length
    : 1;

  const ready = areLoadingVideosReady();
  const percent = ready
    ? 100
    : Math.min(
      99,
      Math.round(progress * 100)
    );

  DOM.loadingProgress.style.width =
    `${percent}%`;

  DOM.rocket.style.left =
    `${percent}%`;

  DOM.loadingText.textContent =
    `${percent}%`;

  return ready;

}


function scheduleLoadingProgress(){

  if(state.loadingFrame !== null){
    return;
  }

  state.loadingFrame = requestAnimationFrame(
    () => {
      state.loadingFrame = null;

      if(renderLoadingProgress()){
        finishLoading();
      }
    }
  );

}


function setupLoadingVideoTracking(){

  state.loadingVideos = getLoadingVideos();

  state.loadingVideos.forEach(
    video => {
      [
        "loadedmetadata",
        "durationchange",
        "loadeddata",
        "canplay",
        "canplaythrough",
        "progress",
        "timeupdate",
        "stalled",
        "suspend",
        "error"
      ].forEach(
        eventName =>
          video.addEventListener(
            eventName,
            scheduleLoadingProgress,
            {passive:true}
          )
      );
    }
  );

}


function startIntro(){

  state.loadingComplete = false;
  state.loadingContinueStarted = false;
  state.loadingVideos = getLoadingVideos();

  if(renderLoadingProgress()){
    finishLoading();
    return;
  }

  scheduleLoadingProgress();

}


/* =========================================================
   FINISH LOADING
   ========================================================= */

function finishLoading(){

  if(state.loadingComplete){
    return;
  }

  if(!areLoadingVideosReady()){
    scheduleLoadingProgress();
    return;
  }

  state.loadingComplete = true;

  DOM.loadingArea.classList.add(
    "ready-to-continue"
  );

}


function continueAfterLoading(){

  if(
    !state.loadingComplete ||
    state.loadingContinueStarted
  ){
    return;
  }

  state.loadingContinueStarted = true;

  DOM.loadingArea.classList.remove(
    "ready-to-continue"
  );

  DOM.loadingArea.classList.add(
    "complete"
  );


  setTimeout(
    () => {

      DOM.introStack.classList.add(
        "ready"
      );


      playIntroVideos();

    },
    CONFIG.stackRevealDelay
  );


  setTimeout(
    () => {

      DOM.introPerson.classList.add(
        "visible"
      );

    },
    CONFIG.personDelay
  );


  setTimeout(
    () => {

      DOM.introHint.classList.add(
        "visible"
      );

    },
    CONFIG.hintDelay
  );

}


/* =========================================================
   PLAY INTRO VIDEOS
   ========================================================= */

function playIntroVideos(){

  DOM.stackCards.forEach(
    stack => {

      const video =
        stack.querySelector(
          ".card-video"
        );

      if(video){
        playCardVideo(video);
      }

    }
  );

}


/* =========================================================
   INTRO INTERACTION
   화면 아무 곳이나 터치하면 카드 펼침
   ========================================================= */

function handleIntroInteraction(){

  if(
    state.introComplete ||
    state.morphing
  ){
    return;
  }


  if(
    !DOM.introStack.classList.contains(
      "ready"
    )
  ){
    return;
  }


  if(
    state.spread
  ){
    return;
  }


  state.spread =
    true;


  // Brief tactile compression before the existing spread animation.
  const pressDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 140;
  DOM.introStack.classList.add("is-pressed");

  setTimeout(() => {
    DOM.introStack.classList.remove("ready", "is-pressed");
    DOM.introStack.classList.add("spread");

    // Keep the full spread duration after the press has finished.
    setTimeout(enterMainFallback, CONFIG.spreadDuration);
  }, pressDuration);


  /*
    이름 / 힌트 제거
  */

  DOM.introHint.classList.remove(
    "visible"
  );

  DOM.introPerson.classList.remove(
    "visible"
  );


}


/* =========================================================
   MORPH TO MAIN
   ========================================================= */

function startMorphToMain(){

  if(
    state.morphing ||
    state.introComplete
  ){
    return;
  }


  state.morphing =
    true;


  const stack =
    document.querySelector(
      ".stack-card-1"
    );


  const preview =
    stack?.querySelector(
      ".screen-card"
    );


  const targetCard =
    DOM.cards[0];


  const targetMedia =
    targetCard?.querySelector(
      ".card-media"
    );


  const targetVideo =
    targetCard?.querySelector(
      ".card-video"
    );

  const targetVideoUrl =
    targetVideo?.currentSrc ||
    targetVideo?.querySelector(
      "source"
    )?.src ||
    "";


  if(
    !stack ||
    !preview ||
    !targetCard ||
    !targetMedia ||
    !targetVideo ||
    !targetVideoUrl
  ){

    enterMainFallback();

    return;

  }


  /*
    실제 target card 위치
  */

  const startRect =
    stack.getBoundingClientRect();


  const endRect =
    targetMedia.getBoundingClientRect();


  /*
    morph video source
  */

  DOM.morphVideo.src =
    targetVideoUrl;


  /*
    intro 영상의 현재 시간 유지
  */

  try{

    if(
      Number.isFinite(
        targetVideo.currentTime
      )
    ){

      DOM.morphVideo.currentTime =
        targetVideo.currentTime;

    }

  }catch{}


  DOM.morphVideo.play().catch(
    () => {}
  );


  /*
    main 준비
  */

  DOM.main.classList.add(
    "active"
  );

  DOM.main.classList.add(
    "initial-reveal"
  );


  /*
    target card 활성화
  */

  targetCard.classList.add(
    "is-active"
  );


  /*
    morph layer 시작 위치
  */

  Object.assign(
    DOM.morphLayer.style,
    {

      left:
        `${startRect.left}px`,

      top:
        `${startRect.top}px`,

      width:
        `${startRect.width}px`,

      height:
        `${startRect.height}px`,

      borderRadius:
        getComputedStyle(
          targetCard
        ).borderRadius,

      opacity:
        "1"

    }
  );


  DOM.morphLayer.classList.add(
    "active"
  );


  /*
    video 동기화
  */

  syncVideoTime(
    DOM.morphVideo,
    targetVideo
  );


  DOM.morphLayer.getBoundingClientRect();


  /*
    FLIP animation
  */

  requestAnimationFrame(
    () => {

      DOM.morphLayer.style.left =
        `${endRect.left}px`;

      DOM.morphLayer.style.top =
        `${endRect.top}px`;

      DOM.morphLayer.style.width =
        `${endRect.width}px`;

      DOM.morphLayer.style.height =
        `${endRect.height}px`;


      DOM.main.style.opacity =
        "1";

    }
  );


  /*
    animation 종료
  */

  setTimeout(
    () => {

      finishMorph(
        targetVideo
      );

    },
    CONFIG.morphDuration
  );

}


/* =========================================================
   SYNC VIDEO
   ========================================================= */

function syncVideoTime(
  fromVideo,
  toVideo
){

  if(
    !fromVideo ||
    !toVideo
  ){
    return;
  }


  const sync =
    () => {

      try{

        if(
          Number.isFinite(
            fromVideo.currentTime
          )
        ){

          toVideo.currentTime =
            fromVideo.currentTime;

        }

      }catch{}

    };


  sync();


  const interval =
    setInterval(
      sync,
      80
    );


  setTimeout(
    () => {

      clearInterval(
        interval
      );

    },
    CONFIG.morphDuration + 300
  );

}


/* =========================================================
   FINISH MORPH
   ========================================================= */

function finishMorph(
  targetVideo
){

  try{

    targetVideo.currentTime =
      DOM.morphVideo.currentTime;

  }catch{}


  let revealed = false;
  const revealTarget = () => {

    if(revealed){
      return;
    }

    revealed = true;

    playCardVideo(targetVideo);

    DOM.morphLayer.style.opacity =
      "0";

    setTimeout(
      () => {

      DOM.morphLayer.classList.remove(
        "active"
      );


      DOM.morphLayer.style.cssText =
        "";


      DOM.intro.classList.add(
        "is-hidden"
      );


      state.introComplete =
        true;


      state.morphing =
        false;


      state.currentCard =
        0;


      renderDeck({immediate:true});


      updateNavigation(
        0
      );


        playCardVideo(targetVideo);

      },
      350
    );
  };

  if(targetVideo.readyState < 2){
    targetVideo.addEventListener(
      "canplay",
      revealTarget,
      {once:true}
    );
  }else{
    revealTarget();
  }

}


/* =========================================================
   FALLBACK
   ========================================================= */

function enterMainFallback(){

  state.introComplete =
    true;

  state.morphing =
    false;


  DOM.main.classList.add(
    "active"
  );

  DOM.main.classList.add(
    "initial-reveal"
  );


  DOM.cards[0].classList.add(
    "is-active"
  );


  renderDeck({immediate:true});


  DOM.intro.classList.add(
    "is-hidden"
  );

}


/* =========================================================
   CARD DECK
   ========================================================= */

function clampDeck(value, min, max){

  return Math.max(min, Math.min(max, value));

}


function setupDeck(){

  renderDeck({immediate:true});

}


function cancelDeckBoundaryBounce(){

  const wasBouncing = state.deckBoundaryTimer !== null;

  if(state.deckBoundaryTimer){
    window.clearTimeout(state.deckBoundaryTimer);
    state.deckBoundaryTimer = null;
  }

  const currentCard = DOM.cards[state.currentCard];
  if(wasBouncing && currentCard){
    currentCard.style.transition = "";
  }

}


function lockDeckWheel(){

  state.deckWheelLocked = true;
  window.clearTimeout(state.deckWheelUnlockTimer);
  state.deckWheelUnlockTimer = null;

}


function scheduleDeckWheelUnlock(){

  window.clearTimeout(state.deckWheelUnlockTimer);
  state.deckWheelUnlockTimer = window.setTimeout(() => {
    state.deckWheelUnlockTimer = null;
    state.deckWheelLocked = false;
  }, 180);

}


function bounceDeckBoundary(direction){

  const card = DOM.cards[state.currentCard];
  if(!card){
    renderDeck();
    return;
  }

  cancelDeckBoundaryBounce();
  state.deckAnimating = false;
  state.deckDragging = false;
  lockDeckWheel();
  state.deckWheelScrubbing = false;
  state.deckOffsetY = 0;

  const nudge = direction < 0 ? -24 : 24;
  card.style.transition = "transform .14s cubic-bezier(.22,.86,.25,1), opacity .14s ease, filter .14s ease";
  card.style.setProperty("--deck-y", `${nudge}px`);

  state.deckBoundaryTimer = window.setTimeout(() => {
    card.style.transition = "transform .24s cubic-bezier(.22,1,.36,1), opacity .18s ease, filter .18s ease";
    card.style.setProperty("--deck-y", "0px");

    state.deckBoundaryTimer = window.setTimeout(() => {
      state.deckBoundaryTimer = null;
      card.style.transition = "";
      renderDeck();
      scheduleDeckWheelUnlock();
    }, 240);
  }, 55);

}


function renderDeck(options = {}){

  const current = state.currentCard;
  const dragOffset = state.deckOffsetY;
  const cardHeight = DOM.main?.clientHeight || window.innerHeight;
  const dragProgress = clampDeck(Math.abs(dragOffset) / Math.max(cardHeight, 1), 0, 1);
  const isDragging = state.deckDragging;
  DOM.main?.classList.toggle(
    "is-deck-busy",
    state.deckAnimating || state.deckDragging || state.deckWheelScrubbing
  );

  DOM.cards.forEach(
    (card, index) => {

      const relative = index - current;
      let y = 0;
      let scale = 1;
      let rotate = 0;
      let opacity = 1;
      let zIndex = 1;
      let visible = true;
      let depthFilter = "brightness(1) saturate(1) blur(0px)";
      let depthShadow = "inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(2,6,12,.72), 0 5px 10px rgba(0,0,0,.40), 0 26px 56px rgba(0,0,0,.30)";

      if(relative === 0){
        y = isDragging ? dragOffset : 0;
        scale = isDragging ? 1 - dragProgress * .025 : 1;
        rotate = isDragging ? dragOffset * -.0125 : 0;
        zIndex = 100;
      }else if(relative === 1 && isDragging && dragOffset < 0){
          y = 18 * (1 - dragProgress);
          scale = .985 + dragProgress * .015;
          opacity = dragProgress;
          depthFilter = `brightness(${.92 + dragProgress * .08}) saturate(${.90 + dragProgress * .10}) blur(${.2 * (1 - dragProgress)}px)`;
          zIndex = 99;
      }else if(relative === -1 && isDragging && dragOffset > 0){
        y = -18 * (1 - dragProgress);
        scale = .985 + dragProgress * .015;
        opacity = dragProgress;
        depthFilter = `brightness(${.92 + dragProgress * .08}) saturate(${.90 + dragProgress * .10}) blur(${.2 * (1 - dragProgress)}px)`;
        zIndex = 99;
      }else{
        visible = false;
        opacity = 0;
        zIndex = 0;
      }

      card.classList.toggle("is-active", relative === 0);
      if(state.introComplete && relative === 0){
        card.classList.add("has-entered");
      }
      card.classList.toggle("is-dragging", isDragging && !state.deckWheelScrubbing && relative === 0);
      card.classList.toggle("is-wheel-scrubbing", state.deckWheelScrubbing && visible);
      card.style.transform = "";
      card.style.opacity = "";
      card.style.zIndex = "";
      card.style.filter = "";
      card.style.boxShadow = "";
      card.style.setProperty("--deck-y", `${y}px`);
      card.style.setProperty("--deck-scale", scale);
      card.style.setProperty("--deck-rotate", `${rotate}deg`);
      card.style.setProperty("--deck-opacity", opacity);
      card.style.setProperty("--deck-z", zIndex);
      card.style.setProperty("--deck-filter", depthFilter);
      card.style.setProperty("--deck-shadow", depthShadow);
      card.style.pointerEvents = relative === 0 && !state.deckAnimating ? "auto" : "none";
      card.setAttribute("aria-hidden", relative === 0 ? "false" : "true");

      if(!visible){
        card.classList.add("deck-hidden");
      }else{
        card.classList.remove("deck-hidden");
      }

    }
  );

  if(options.immediate){
    DOM.cards.forEach(card => { card.style.transition = "none"; });
    requestAnimationFrame(() => {
      DOM.cards.forEach(card => { card.style.transition = ""; });
    });
  }

}


function animateDeckTo(target, options = {}){

  if(
    state.deckAnimating ||
    target < 0 ||
    target >= DOM.cards.length ||
    target === state.currentCard
  ){
    return;
  }

  const from = state.currentCard;
  const direction = target > from ? -1 : 1;
  const currentCard = DOM.cards[from];
  const nextCard = DOM.cards[target];
  const isWheel = options.source === "wheel";
  const motionDuration = isWheel ? .66 : .82;
  const opacityDuration = isWheel ? .66 : .68;
  const motionEase = isWheel
    ? "cubic-bezier(.22,.86,.25,1)"
    : "cubic-bezier(.16,1,.3,1)";
  const finishDelay = Math.round(motionDuration * 1000) + 30;

  cancelDeckBoundaryBounce();
  window.clearTimeout(state.deckWheelResetTimer);
  state.deckWheelResetTimer = null;
  if(isWheel){
    lockDeckWheel();
  }
  state.deckAnimating = true;
  state.deckDragging = false;
  state.deckWheelScrubbing = false;
  state.deckOffsetY = 0;

  // Start preparing the destination video before the card transition begins.
  // This removes the visible pause at the end of the deck animation.
  syncCardVideos(target);
  window.ZNUS?.preloadCardMedia?.(target);
  if(state.introComplete){
    nextCard.classList.add("has-entered");
  }

  renderDeck({immediate:true});

  // Both directions enter from one card-height away, instead of mixing
  // a near-visible next card with a hidden previous card.
  if(isWheel){
    nextCard.classList.remove("deck-hidden");
    nextCard.style.setProperty("--deck-y", `${-direction * 108}%`);
    nextCard.style.setProperty("--deck-scale", "1");
    nextCard.style.setProperty("--deck-rotate", "0deg");
    nextCard.style.setProperty("--deck-opacity", "1");
    nextCard.style.setProperty("--deck-z", "110");
    // Commit the starting position while transitions are disabled.
    nextCard.getBoundingClientRect();
  }

  requestAnimationFrame(() => {

    // Reveal the incoming card's content as its video and card motion begin.
    nextCard.classList.add("is-active");
    nextCard.classList.add("is-edge-reflecting");

    currentCard.style.transition = `transform ${motionDuration}s ${motionEase}, opacity ${opacityDuration}s ease, filter ${motionDuration}s ease`;
    currentCard.style.setProperty("--deck-y", `${direction * 108}%`);
    currentCard.style.setProperty("--deck-rotate", `${direction * -2.5}deg`);
    currentCard.style.setProperty("--deck-scale", ".975");
    currentCard.style.setProperty("--deck-opacity", "0");
    currentCard.style.filter = "";

    nextCard.style.transition = `transform ${motionDuration}s ${motionEase}, opacity ${opacityDuration}s ease, filter ${motionDuration}s ease`;
    nextCard.style.setProperty("--deck-y", "0px");
    nextCard.style.setProperty("--deck-rotate", "0deg");
    nextCard.style.setProperty("--deck-scale", "1");
    nextCard.style.setProperty("--deck-opacity", "1");
    nextCard.style.filter = "";
    nextCard.style.setProperty("--deck-z", "110");

  window.setTimeout(() => {

    state.currentCard = target;
    nextCard.classList.remove("is-edge-reflecting");
    state.deckAnimating = false;
    state.deckOffsetY = 0;
    renderDeck({immediate:true});
    updateNavigation(target);
    syncCardVideos(target);
    window.ZNUS?.preloadCardMedia?.(target);

    if(isWheel){
      state.deckWheelLocked = false;
    }

  }, finishDelay);
  });

}


/* =========================================================
   ACTIVATE CARD
   ========================================================= */

function activateCard(
  card
){

  DOM.cards.forEach(
    item => {

      if(
        item !== card
      ){

        item.classList.remove(
          "is-active"
        );

      }

    }
  );


  card.classList.add(
    "is-active"
  );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function updateNavigation(
  index
){

  DOM.navDots.forEach(
    (dot,dotIndex) => {

      dot.classList.toggle(
        "active",
        dotIndex === index
      );

    }
  );

}


/* =========================================================
   GO CARD
   ========================================================= */

function goToCard(
  index
){

  if(
    !state.introComplete ||
    state.deckAnimating
  ){
    return;
  }


  const target =
    Math.max(
      0,
      Math.min(
        DOM.cards.length - 1,
        index
      )
    );

  if(target === state.currentCard){
    return;
  }

  animateDeckTo(target);

}

/* =========================================================
   HEART
   한 번 클릭할 때마다
   화면의 랜덤한 위치에 하트 하나
   ========================================================= */

const reactionEmojis = ["❤️", "👍", "👏", "🥰", "😍", "😊"];
let previousReaction = -1;
function createHeartBurst(event){
  event?.preventDefault?.();
  event?.stopPropagation?.();
  if(!DOM.heartButton){ return; }
  const card = DOM.heartButton.closest(".screen-card");
  if(!card){ return; }
  const rect = card.getBoundingClientRect();
  // Keep reactions within the visible profile, away from the screen edges.
  const left = Math.max(0, rect.left);
  const right = Math.min(window.innerWidth, rect.right);
  const top = Math.max(0, rect.top);
  const bottom = Math.min(window.innerHeight, rect.bottom);
  if(right <= left || bottom <= top){ return; }
  createHeart(left + (right-left) * (.10 + Math.random() * .80),
    top + (bottom-top) * (.14 + Math.random() * .72));
}
function createHeart(originX, originY){
  const existing = document.querySelectorAll(".floating-heart");
  if(existing.length >= 8){ existing[0].remove(); }
  const heart = document.createElement("span");
  heart.className = "floating-heart";
  heart.setAttribute("aria-hidden", "true");
  // Avoid the same emoji on consecutive taps.
  const choice = (previousReaction + 1 + Math.floor(Math.random() * (reactionEmojis.length - 1))) % reactionEmojis.length;
  previousReaction = choice;
  heart.textContent = reactionEmojis[choice];
  heart.style.left = originX + "px";
  heart.style.top = originY + "px";
  heart.style.setProperty("--x", (Math.random() * 48 - 24) + "px");
  heart.style.setProperty("--y", (-70 - Math.random() * 35) + "px");
  heart.style.setProperty("--tilt", (Math.random() * 24 - 12) + "deg");
  document.body.appendChild(heart);
  requestAnimationFrame(() => heart.classList.add("is-active"));
  const timeout = setTimeout(() => heart.remove(), 1600);
  heart.addEventListener("animationend", () => {
    clearTimeout(timeout);
    heart.remove();
  }, {once:true});
}

function toggleLanguage(
  event
){

  event.stopPropagation();


  state.language =
    state.language === "ko"
      ? "en"
      : "ko";


  document
    .querySelectorAll(
      "[data-ko][data-en]"
    )
    .forEach(
      element => {

        element.textContent =
          element.dataset[
            state.language
          ];

      }
    );

}


/* =========================================================
   COPY
   ========================================================= */

async function copyToClipboard(
  value
){

  try{

    await navigator.clipboard
      .writeText(
        value
      );

    return true;

  }catch{

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      value;


    textarea.style.position =
      "fixed";


    textarea.style.opacity =
      "0";


    document.body.appendChild(
      textarea
    );


    textarea.select();


    try{

      document.execCommand(
        "copy"
      );

    }catch{}


    textarea.remove();


    return true;

  }

}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(
  message
){

  clearTimeout(
    state.toastTimer
  );


  DOM.toast
    .querySelector(
      "span"
    )
    .textContent =
      message;


  DOM.toast.classList.add(
    "show"
  );


  state.toastTimer =
    setTimeout(
      () => {

        DOM.toast.classList.remove(
          "show"
        );

      },
      CONFIG.toastDuration
    );

}


/* =========================================================
   SHARE
   ========================================================= */

async function shareProfile(){

  const shareData = {

    title:
      "ZNUS Profile",

    text:
      "ZNUS Digital Profile",

    url:
      window.location.href

  };


  if(
    navigator.share
  ){

    try{

      await navigator.share(
        shareData
      );

    }catch(error){

      if(
        error.name !==
        "AbortError"
      ){

        showToast(
          "공유할 수 없습니다"
        );

      }

    }

    return;

  }


  await copyToClipboard(
    window.location.href
  );


  showToast(
    "페이지 주소가 복사되었습니다"
  );

}

/* =========================================================
   CONTACT PHONE SPACING
   원본 디자인의 FAX/TEL 라벨과 번호 간격 유지
   ========================================================= */

function restoreContactPhoneSpacing(){

  const data = window.__ZNUS_CARD__ || {};
  const links = document.querySelectorAll(".contact-details .contact-link");
  const formatPhone = value => {
    const digits = String(value || "").replace(/\D/g, "");
    if(/^\d{3}\d{3}\d{4}$/.test(digits)){
      return digits.replace(/^(\d{3})(\d{3})(\d{4})$/, "$1 $2 $3");
    }
    if(/^\d{3}\d{4}\d{4}$/.test(digits)){
      return digits.replace(/^(\d{3})(\d{4})(\d{4})$/, "$1 $2 $3");
    }
    return String(value || "");
  };
  const gap = String.fromCharCode(160) + String.fromCharCode(160);

  if(links[1]){
    links[1].textContent = "FAX" + gap + formatPhone(data.companyFax);
  }
  if(links[2]){
    links[2].textContent = "TEL" + gap + formatPhone(data.companyPhone);
  }

}

restoreContactPhoneSpacing();
