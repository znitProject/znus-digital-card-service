services:
  db:
    image: postgres:16-alpine
    container_name: znus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-znus_cards}
      POSTGRES_USER: ${POSTGRES_USER:-znus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - znus_postgres_data:/var/lib/postgresql/data
    # Bind only to the remote PC's Tailscale address, not every interface.
    ports:
      - "${DB_BIND_ADDRESS:-100.102.230.73}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-znus_admin} -d ${POSTGRES_DB:-znus_cards}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  znus_postgres_data:
