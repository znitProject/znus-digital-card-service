<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZNUS 직원 명함 갤러리</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08090d;
        --panel: #12151d;
        --panel-soft: #181c26;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f5f7fb;
        --muted: #8992a4;
        --accent: #8ca7ff;
        --success: #63d3a0;
        --warning: #f3c976;
        --danger: #ff8d8d;
        --radius: 20px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--text);
        background:
          radial-gradient(circle at 10% 0%, rgba(97, 112, 255, 0.18), transparent 32rem),
          var(--bg);
        font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, select { font: inherit; }
      button { cursor: pointer; }
      .shell { max-width: 1440px; margin: 0 auto; padding: 34px 28px 64px; }
      .topbar { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; margin-bottom: 30px; }
      .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 46px); letter-spacing: -.055em; }
      .subtitle { margin: 12px 0 0; color: var(--muted); }
      .connection { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; white-space: nowrap; }
      .connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warning); box-shadow: 0 0 16px var(--warning); }
      .connection.ready::before { background: var(--success); box-shadow: 0 0 16px var(--success); }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
      .stat, .toolbar, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgba(18, 21, 29, .88); box-shadow: 0 20px 70px rgba(0,0,0,.16); }
      .stat { padding: 20px; }
      .stat__label { color: var(--muted); font-size: 13px; }
      .stat__value { margin-top: 10px; font-size: 32px; letter-spacing: -.05em; }
      .toolbar { display: grid; grid-template-columns: 1.4fr .8fr auto; gap: 12px; padding: 14px; margin-bottom: 24px; }
      input, select { width: 100%; color: var(--text); border: 1px solid var(--line); border-radius: 12px; outline: none; padding: 13px 14px; background: var(--panel-soft); }
      input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(140, 167, 255, .14); }
      .btn { border: 1px solid var(--line); border-radius: 12px; color: var(--text); padding: 0 18px; background: #202636; }
      .btn:hover { border-color: rgba(255,255,255,.3); background: #293148; }
      .btn.primary { color: #0a0d14; border-color: transparent; background: var(--accent); font-weight: 700; }
      .layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(340px, .8fr); gap: 24px; align-items: start; }
      .panel { overflow: hidden; }
      .panel__head { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 20px 22px; border-bottom: 1px solid var(--line); }
      .panel__title { margin: 0; font-size: 16px; }
      .panel__meta { color: var(--muted); font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; padding: 18px; }
      .employee { position: relative; padding: 14px; border: 1px solid var(--line); border-radius: 17px; background: linear-gradient(145deg, #1a1f2a, #11141b); transition: transform .2s ease, border-color .2s ease; }
      .employee:hover, .employee.selected { transform: translateY(-3px); border-color: rgba(140, 167, 255, .75); }
      .employee__top { display: flex; gap: 12px; align-items: center; }
      .avatar { display: grid; place-items: center; flex: 0 0 48px; width: 48px; height: 48px; border-radius: 15px; color: #fff; background: linear-gradient(135deg, #6375d9, #af72d7); font-weight: 800; }
      .avatar img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
      .employee__name { margin: 0; font-weight: 700; }
      .employee__role { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
      .employee__url { overflow: hidden; margin: 18px 0 14px; color: #b8c4ff; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 5px 8px; color: var(--muted); background: rgba(255,255,255,.07); font-size: 11px; }
      .chip.success { color: var(--success); background: rgba(99, 211, 160, .1); }
      .chip.warning { color: var(--warning); background: rgba(243, 201, 118, .1); }
      .empty { padding: 54px 20px; color: var(--muted); text-align: center; }
      .detail { position: sticky; top: 20px; }
      .preview { min-height: 620px; display: grid; place-items: stretch; padding: 0; overflow: hidden; background: #050505; }
      .current-card-frame { width: 100%; height: 620px; display: block; border: 0; background: #050505; }
      .card-preview { position: relative; width: min(100%, 300px); min-height: 420px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; padding: 25px; border: 1px solid rgba(255,255,255,.18); border-radius: 25px; background: linear-gradient(150deg, #25314c, #11141d 60%, #30204b); box-shadow: 0 28px 60px rgba(0,0,0,.45); }
      .card-preview::after { content: ""; position: absolute; width: 250px; height: 250px; right: -95px; bottom: -80px; border-radius: 50%; background: rgba(110, 231, 220, .14); filter: blur(10px); }
      .card-preview__brand { position: relative; z-index: 1; color: #b8c4ff; font-size: 12px; font-weight: 800; letter-spacing: .14em; }
      .card-preview__body { position: relative; z-index: 1; }
      .card-preview__name { margin: 0; font-size: 30px; letter-spacing: -.06em; }
      .card-preview__role { margin: 8px 0 0; color: #bfc5d7; font-size: 13px; }
      .card-preview__details { display: grid; gap: 8px; margin-top: 32px; color: #d8dce8; font-size: 12px; }
      .card-preview__details span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .detail__body { padding: 20px 22px 24px; }
      .detail__name { margin: 0; font-size: 24px; letter-spacing: -.04em; }
      .detail__meta { margin: 5px 0 20px; color: var(--muted); font-size: 13px; }
      .detail-list { display: grid; gap: 11px; margin: 0; }
      .detail-list div { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 12px; }
      .detail-list dd { max-width: 65%; margin: 0; color: var(--text); text-align: right; overflow-wrap: anywhere; }
      .detail__actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 20px; }
      .error { margin: 16px 18px 0; padding: 12px 14px; border: 1px solid rgba(255,141,141,.25); border-radius: 12px; color: var(--danger); background: rgba(255,141,141,.08); font-size: 13px; }
      .hidden { display: none !important; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .detail { position: static; } }
      @media (max-width: 680px) { .shell { padding: 24px 16px 42px; } .topbar { display: block; } .connection { margin-top: 18px; } .stats { grid-template-columns: repeat(2, 1fr); } .toolbar { grid-template-columns: 1fr; } .btn { min-height: 44px; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">ZNUS / ADMIN GALLERY</p>
          <h1>직원 명함 갤러리</h1>
          <p class="subtitle">Google Sheets에 입력된 직원 데이터를 한눈에 확인합니다.</p>
        </div>
        <div class="connection" id="connectionStatus">Google Sheets 연결 중</div>
      </header>

      <section class="stats" aria-label="요약">
        <article class="stat"><div class="stat__label">전체 직원</div><div class="stat__value" id="totalCount">-</div></article>
        <article class="stat"><div class="stat__label">생성 완료</div><div class="stat__value" id="completeCount">-</div></article>
        <article class="stat"><div class="stat__label">처리 중</div><div class="stat__value" id="processingCount">-</div></article>
        <article class="stat"><div class="stat__label">검토 필요</div><div class="stat__value" id="errorCount">-</div></article>
      </section>

      <section class="toolbar" aria-label="직원 검색">
        <input id="searchInput" type="search" placeholder="이름, 부서, 직원 ID 검색" />
        <select id="statusFilter">
          <option value="all">전체 상태</option>
          <option value="생성완료">생성 완료</option>
          <option value="입력완료">입력 완료</option>
          <option value="검토필요">검토 필요</option>
        </select>
        <button class="btn primary" id="refreshButton" type="button">새로고침</button>
      </section>

      <div id="errorBox" class="error hidden" role="alert"></div>

      <section class="layout">
        <section class="panel">
          <div class="panel__head">
            <h2 class="panel__title">직원 목록</h2>
            <span class="panel__meta" id="listMeta">불러오는 중</span>
          </div>
          <div class="grid" id="employeeGrid"></div>
        </section>

        <aside class="panel detail" id="detailPanel">
          <div class="panel__head"><h2 class="panel__title">명함 미리보기</h2><span class="panel__meta">선택한 직원</span></div>
          <div class="preview" id="preview"></div>
          <div class="detail__body" id="detailBody"></div>
        </aside>
      </section>
    </main>

    <script>
      const state = { employees: [], selectedId: null };

      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
      const initials = (employee) => (employee.name || employee.nameEn || '?').replace(/\s+/g, '').slice(0, 2).toUpperCase();
      const selectedEmployee = () => state.employees.find((employee) => employee.employeeId === state.selectedId);

      function setConnection(ready, text) {
        const element = $('#connectionStatus');
        element.textContent = text;
        element.classList.toggle('ready', ready);
      }

      function showError(message) {
        $('#errorBox').textContent = message;
        $('#errorBox').classList.remove('hidden');
      }

      function clearError() { $('#errorBox').classList.add('hidden'); }

      function filteredEmployees() {
        const query = $('#searchInput').value.trim().toLowerCase();
        const status = $('#statusFilter').value;
        return state.employees.filter((employee) => {
          const searchable = [employee.employeeId, employee.name, employee.nameEn, employee.department, employee.position].join(' ').toLowerCase();
          return (!query || searchable.includes(query)) && (status === 'all' || employee.status === status);
        });
      }

      function renderStats() {
        const employees = state.employees;
        $('#totalCount').textContent = employees.length;
        $('#completeCount').textContent = employees.filter((employee) => employee.status === '생성완료').length;
        $('#processingCount').textContent = employees.filter((employee) => employee.status === '입력완료').length;
        $('#errorCount').textContent = employees.filter((employee) => employee.status === '검토필요' || employee.missingFields?.length).length;
      }

      function statusChip(label, completed) {
        return `<span class="chip ${completed ? 'success' : 'warning'}">${escapeHtml(label)} ${completed ? '완료' : '대기'}</span>`;
      }

      function renderGrid() {
        const employees = filteredEmployees();
        $('#listMeta').textContent = `${employees.length}명 표시 / 전체 ${state.employees.length}명`;
        if (!employees.length) {
          $('#employeeGrid').innerHTML = '<div class="empty">조건에 맞는 직원이 없습니다.</div>';
          return;
        }

        $('#employeeGrid').innerHTML = employees.map((employee) => `
          <article class="employee ${employee.employeeId === state.selectedId ? 'selected' : ''}" data-id="${escapeHtml(employee.employeeId)}" tabindex="0">
            <div class="employee__top">
              <div class="avatar">${employee.profileImage ? `<img src="${escapeHtml(employee.profileImage)}" alt="">` : escapeHtml(initials(employee))}</div>
              <div>
                <h3 class="employee__name">${escapeHtml(employee.name || employee.nameEn || '이름 없음')}</h3>
                <p class="employee__role">${escapeHtml([employee.department, employee.position].filter(Boolean).join(' / ') || '직무 정보 없음')}</p>
              </div>
            </div>
            <div class="employee__url">${escapeHtml(employee.mobileUrl || '모바일 명함 URL 없음')}</div>
            <div class="chips">
              <span class="chip ${employee.status === '생성완료' ? 'success' : 'warning'}">${escapeHtml(employee.status)}</span>
              ${employee.missingFields?.length ? '<span class="chip warning">입력 누락</span>' : ''}
            </div>
          </article>
        `).join('');

        document.querySelectorAll('.employee').forEach((card) => {
          card.addEventListener('click', () => selectEmployee(card.dataset.id));
          card.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') selectEmployee(card.dataset.id); });
        });
      }

      function renderDetail() {
        const employee = selectedEmployee();
        if (!employee) {
          $('#preview').innerHTML = '<div class="empty">직원을 선택하면 명함을 미리볼 수 있습니다.</div>';
          $('#detailBody').innerHTML = '';
          return;
        }

        $('#preview').innerHTML = employee.mobileUrl
          ? `<iframe class="current-card-frame" src="${escapeHtml(employee.mobileUrl)}" title="${escapeHtml(employee.name || '직원')} 최신 명함 미리보기"></iframe>`
          : '<div class="empty">공개 명함 URL을 연결하면 최신 카드 디자인을 미리볼 수 있습니다.</div>';

        $('#detailBody').innerHTML = `
          <h3 class="detail__name">${escapeHtml(employee.name || employee.nameEn || '이름 없음')}</h3>
          <p class="detail__meta">${escapeHtml([employee.department, employee.position].filter(Boolean).join(' / '))}</p>
          <dl class="detail-list">
            <div><dt>직원 ID</dt><dd>${escapeHtml(employee.employeeId)}</dd></div>
            <div><dt>Google 계정</dt><dd>${escapeHtml(employee.accountEmail || '-')}</dd></div>
            <div><dt>영문 이름 / 직책</dt><dd>${escapeHtml([employee.nameEn, employee.positionEn].filter(Boolean).join(' / '))}</dd></div>
            <div><dt>공개 전화</dt><dd>${escapeHtml(employee.phone || '-')}</dd></div>
            <div><dt>모바일 URL</dt><dd>${escapeHtml(employee.mobileUrl || '-')}</dd></div>
            <div><dt>이메일</dt><dd>${escapeHtml(employee.email || '-')}</dd></div>
            <div><dt>최종 수정</dt><dd>${escapeHtml(employee.updatedAt || '-')}</dd></div>
            ${(employee.roles || []).map((role, i) => `<div><dt>업무 ${i + 1}</dt><dd>${escapeHtml(role.ko)}<br>${escapeHtml(role.en)}</dd></div>`).join('')}
            ${(employee.backgrounds || []).map(background => `<div><dt>${escapeHtml(({profile:'프로필',role:'직무',contact:'연락처',company:'회사',links:'링크'})[background.type])} 배경</dt><dd>${escapeHtml(({DEFAULT:'기본',IMAGE:'이미지',VIDEO:'영상'})[background.mode] || background.mode)}</dd></div>`).join('')}
          </dl>
          ${employee.errorMessage ? `<p class="error">${escapeHtml(employee.errorMessage)}</p>` : ''}
          ${employee.missingFields?.length ? `<p class="error">입력 누락: ${escapeHtml(employee.missingFields.join(', '))}</p>` : ''}
          <div id="employeeQr" aria-label="직원 명함 QR" style="background:white;max-width:180px;margin:20px auto"></div>
          <div class="detail__actions">
            <button class="btn" id="copyUrlButton" type="button">URL 복사</button>
            <button class="btn primary" id="openUrlButton" type="button">명함 열기</button>
          </div>
        `;
        if (employee.mobileUrl && typeof qrcode === 'function') {
          const qr = qrcode(0, 'M'); qr.addData(employee.mobileUrl); qr.make();
          $('#employeeQr').innerHTML = qr.createSvgTag({cellSize:4, margin:4, scalable:true});
        }
        $('#copyUrlButton').addEventListener('click', () => copyText(employee.mobileUrl));
        $('#openUrlButton').addEventListener('click', () => { if (employee.mobileUrl) window.open(employee.mobileUrl, '_blank', 'noopener'); });
      }

      function selectEmployee(employeeId) {
        state.selectedId = employeeId;
        renderGrid();
        renderDetail();
      }

      async function copyText(value) {
        if (!value) return;
        try {
          await navigator.clipboard.writeText(value);
          const button = $('#copyUrlButton');
          button.textContent = '복사 완료';
          setTimeout(() => { button.textContent = 'URL 복사'; }, 1200);
        } catch (error) {
          showError('URL을 복사하지 못했습니다.');
        }
      }

      let refreshInFlight = false;
      function loadEmployees() {
        if (refreshInFlight) return;
        refreshInFlight = true;
        clearError();
        setConnection(false, 'Google Sheets 연결 중');
        google.script.run
          .withSuccessHandler((employees) => {
            state.employees = employees || [];
            const selectedStillExists = state.employees.some((employee) => employee.employeeId === state.selectedId);
            state.selectedId = selectedStillExists ? state.selectedId : (state.employees[0]?.employeeId || null);
            renderStats();
            renderGrid();
            renderDetail();
            setConnection(true, 'Google Sheets 연결됨 · 자동 갱신 중');
            refreshInFlight = false;
          })
          .withFailureHandler((error) => {
            setConnection(false, '연결 실패');
            showError(error?.message || 'Google Sheets 데이터를 불러오지 못했습니다.');
            $('#listMeta').textContent = '데이터를 불러오지 못함';
            refreshInFlight = false;
          })
          .getEmployees();
      }

      $('#searchInput').addEventListener('input', renderGrid);
      $('#statusFilter').addEventListener('change', renderGrid);
      $('#refreshButton').addEventListener('click', loadEmployees);
      loadEmployees();
      // 시트가 바뀌면 열린 관리자 화면에도 신규 직원과 수정 내용이 반영됩니다.
      setInterval(loadEmployees, 10000);
    </script>
  </body>
</html>
