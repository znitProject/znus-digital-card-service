<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:24px;font:14px system-ui;color:#182332;background:#f7f8fa}h1{font-size:24px}button,input,select{font:inherit;padding:9px;border:1px solid #ccd4de;border-radius:6px}button{cursor:pointer;background:white}button:disabled{opacity:.5;cursor:wait}header,.toolbar,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}#stats{padding:16px;background:#e7effa;border-radius:10px;margin:18px 0}table{width:100%;border-collapse:collapse;background:white;margin-top:18px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e1e5eb}#message{min-height:25px;color:#a52d21}#editor{background:white;padding:20px;margin-top:20px}#fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:5px}small{color:#566476}a{color:#1554a5}#editor[hidden]{display:none}
</style></head><body data-initial='<?!= initialData ?>'>
<header><div><h1>명함 관리</h1><small>정보 수정과 공개 상태를 관리합니다. 설문 처리 중인 명함은 완료 후 수정해 주세요.</small></div><button id="refresh">새로고침</button></header>
<p id="message" role="status" aria-live="polite"></p><div id="stats"></div>
<div class="toolbar"><input id="search" placeholder="이름·부서·직함·이메일 검색" aria-label="명함 검색"><select id="filter" aria-label="상태 필터"><option value="">전체 상태</option><option value="public">공개</option><option value="private">비공개</option><option value="inactive">비활성</option><option value="ERROR">오류</option><option value="PROCESSING">처리 중</option></select><button id="company">회사 공통정보</button></div>
<table><thead><tr><th>이름 / 부서</th><th>직함</th><th>상태</th><th>공개 명함</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table>
<section id="editor" hidden><h2 id="editor-title"></h2><p id="help"></p><form id="form"><div id="fields"></div><p class="actions"><button type="submit">변경사항 저장</button><button type="button" id="close">닫기</button></p></form></section>
<script>
let state=JSON.parse(document.body.dataset.initial), selected, editingCompany=false;
const $=id=>document.getElementById(id),yes=value=>value===true||String(value).toLowerCase()==='true';
const rpc=(method,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args));
async function run(task){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('message').textContent='처리하고 있습니다…';try{await task();$('message').textContent='완료되었습니다.';}catch(error){$('message').textContent=error.message||String(error);}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
function refresh(){window.location.reload();}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(fn);return b;}
function render(){ $('rows').replaceChildren();const query=$('search').value.trim().toLowerCase();const filter=$('filter').value;
state.cards.filter(c=>[c.nameKo,c.nameEn,c.department,c.jobTitleKo,c.googleAccountEmail,c.publicEmail].join(' ').toLowerCase().includes(query)).filter(c=>!filter||(filter==='public'?yes(c.isActive)&&yes(c.published):filter==='private'?!yes(c.isActive)||!yes(c.published):filter==='inactive'?!yes(c.isActive):c.processingStatus===filter)).forEach(c=>{
 const tr=document.createElement('tr');const values=[c.nameKo+' / '+c.department,c.jobTitleKo,(!yes(c.isActive)?'비활성':yes(c.published)?'공개':'비공개')+' · '+c.processingStatus];values.forEach(value=>{const td=document.createElement('td');td.textContent=value;tr.append(td);});
 const links=document.createElement('td');if(/^https:\/\//.test(c.publicUrl)){const a=document.createElement('a');a.href=c.publicUrl;a.target='_blank';a.rel='noopener';a.textContent='명함 열기';links.append(a,button('주소 복사',()=>navigator.clipboard.writeText(c.publicUrl)));}else links.textContent='공개 주소 연결 전';tr.append(links);
 const actions=document.createElement('td');actions.append(button('수정',()=>edit(c)),button('미리보기',()=>rpc('openAdminPreview',c.publicToken)),button(yes(c.published)?'비공개로':'공개하기',async()=>{await rpc('setAdminCardState',c.cardId,c.updatedAt,yes(c.published)?'private':'publish');await refresh();}),button(yes(c.isActive)?'비활성화':'활성화',async()=>{if(!confirm(yes(c.isActive)?'명함을 비공개로 전환하고 설문을 통한 수정을 차단할까요?':'명함 수정을 다시 허용할까요? 공개는 별도로 설정해야 합니다.'))return;await rpc('setAdminCardState',c.cardId,c.updatedAt,yes(c.isActive)?'disable':'enable');await refresh();}));tr.append(actions);$('rows').append(tr);
});if(!$('rows').children.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent='조건에 맞는 명함이 없습니다.';tr.append(td);$('rows').append(tr);}}
const labels={googleAccountEmail:'설문 제출용 Google 계정',nameKo:'이름 (한국어)',nameEn:'이름 (영문)',department:'부서',jobTitleKo:'직함 (한국어)',jobTitleEn:'직함 (영문)',mobilePhone:'휴대전화',publicEmail:'공개 이메일',profileImageFileId:'프로필 이미지 Drive 파일 ID',companyName:'회사 이름',companyWebsite:'회사 홈페이지',companyPhone:'회사 전화',companyFax:'회사 팩스',officeAddress:'회사 주소',companyLogoFileId:'회사 로고 Drive 파일 ID',sloganLine1:'슬로건 첫째 줄',sloganLine2:'슬로건 둘째 줄',sloganLine3:'슬로건 셋째 줄'};
for(let i=1;i<=5;i++){labels['roleItem'+i+'Ko']='직무 '+i+' (한국어)';labels['roleItem'+i+'En']='직무 '+i+' (영문)';}
function field(key,value,label){const wrapper=document.createElement('label');wrapper.textContent=label||labels[key]||key;const input=document.createElement('input');input.name=key;input.value=value||'';input.required=true;wrapper.append(input);$('fields').append(wrapper);return input;}
function edit(c){editingCompany=false;selected=c;$('fields').replaceChildren();$('editor-title').textContent=c.nameKo+' 명함 수정';$('help').textContent='공개 주소는 유지됩니다. 배경 파일을 비워두면 현재 배경을 유지합니다. 기본 배경으로 복원하려면 해당 항목을 선택하세요.';
Object.keys(labels).filter(key=>!key.startsWith('company')&&!key.startsWith('slogan')&&key!=='officeAddress').forEach(key=>field(key,c[key]));
const names={profile:'프로필',role:'직무',contact:'연락처',company:'회사 소개',links:'링크'};for(const key of Object.keys(names)){const label=document.createElement('label');label.textContent=names[key]+' 배경';const select=document.createElement('select');select.name=key+'BackgroundMode';for(const [value,text] of [['','현재 배경 유지'],['DEFAULT','기본 배경으로 복원'],['IMAGE','새 이미지 사용'],['VIDEO','새 MP4 사용 (최대 5초)']]){const option=document.createElement('option');option.value=value;option.textContent=text;select.append(option);}label.append(select);$('fields').append(label);field(key+'BackgroundFileId','',names[key]+' 새 파일 Drive ID').required=false;}
$('editor').hidden=false;$('editor').scrollIntoView({behavior:'smooth'});if(c.errorMessage)$('message').textContent=c.errorMessage;}
$('company').onclick=()=>{editingCompany=true;$('fields').replaceChildren();$('editor-title').textContent='회사 공통정보';$('help').textContent='저장하면 모든 명함에 동일하게 적용됩니다.';['companyName','companyWebsite','companyPhone','companyFax','officeAddress','companyLogoFileId','sloganLine1','sloganLine2','sloganLine3'].forEach(key=>field(key,state.company[key]));$('editor').hidden=false;};
$('form').onsubmit=event=>{event.preventDefault();run(async()=>{const input=Object.fromEntries(new FormData(event.target));await(editingCompany?rpc('saveCompanySettings',input):rpc('saveAdminCard',selected.cardId,selected.updatedAt,input));$('editor').hidden=true;await refresh();});};
$('close').onclick=()=>{$('editor').hidden=true;};$('refresh').onclick=refresh;$('search').oninput=render;$('filter').onchange=render;const s=state.stats;$('stats').textContent=`전체 ${s.total} · 공개 ${s.public} · 비공개 ${s.private} · 처리 중 ${s.processing} · 오류 ${s.error}`;render();
</script></body></html>
