<!doctype html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><title>ZNUS Digital Card</title><style>
:root{--ink:#fff;--panel:rgba(7,8,12,.42);--line:rgba(255,255,255,.26);--ease:cubic-bezier(.22,1,.36,1)}*{box-sizing:border-box}html,body{margin:0;background:#050505;color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif}body{overflow:hidden}.deck{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.deck::-webkit-scrollbar{display:none}.card{position:relative;isolation:isolate;min-height:100dvh;overflow:hidden;display:flex;align-items:flex-end;padding:max(30px,env(safe-area-inset-top)) 24px max(34px,env(safe-area-inset-bottom));scroll-snap-align:start;scroll-snap-stop:always;background:radial-gradient(circle at 20% 10%,#4f607d 0,transparent 45%),linear-gradient(145deg,#0a0b10,#171923)}.media,.shade{position:absolute;inset:0;z-index:-2}.media img,.media video{width:100%;height:100%;object-fit:cover;object-position:var(--pos,50% 50%)}.media video{background:#111}.shade{z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,var(--top,.1)),rgba(0,0,0,var(--dark,.66)) 100%)}.mark{position:absolute;top:max(25px,env(safe-area-inset-top));left:24px;font-size:11px;font-weight:bold;letter-spacing:.2em}.count{position:absolute;top:max(25px,env(safe-area-inset-top));right:24px;color:#d8dce5;font-size:11px;letter-spacing:.14em}.content{width:min(100%,540px);animation:rise .7s var(--ease) both}.avatar{width:88px;height:88px;margin-bottom:22px;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#30394f}.avatar img{width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:clamp(44px,14vw,78px);letter-spacing:-.075em;line-height:.9}.en,.role{margin:12px 0 0;color:#e1e4eb;letter-spacing:.03em}.role{font-size:14px}.body{margin:22px 0 0;max-width:38ch;color:#f0f1f5;line-height:1.6;white-space:pre-line}.details{display:grid;gap:11px;margin-top:26px}.details a,.details span{color:#fff;text-decoration:none;overflow-wrap:anywhere}.details b{display:inline-block;width:68px;color:#d0d7e3;font-size:10px;letter-spacing:.12em}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:26px}.actions a,.action{display:grid;min-height:54px;place-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);color:#fff;text-decoration:none;font-size:13px}.actions .primary{border-color:#fff;background:#fff;color:#06070a;font-weight:bold}.error{display:grid;min-height:100dvh;place-items:center;padding:30px;text-align:center;color:#f0b2b2}.hint{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.16em;color:rgba(255,255,255,.6)}@keyframes rise{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.content{animation:none}.deck{scroll-behavior:auto}}
</style></head><body><main id="app" class="deck"></main><script>
const SLUG='<?= slug ?>';const app=document.getElementById('app');const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=v=>/^https?:\/\//i.test(v||'')?v:'';const isDataSaver=()=>navigator.connection&&navigator.connection.saveData;
function media(section){const b=section.background||{};if(!b.url||b.kind==='none')return '';const position=esc(b.position||'50% 50%');if(b.kind==='image')return `<div class="media" style="--pos:${position}"><img src="${esc(b.url)}" alt="" loading="lazy"></div>`;if(b.kind==='video'){const poster=safe(b.posterUrl);if(isDataSaver())return poster?`<div class="media" style="--pos:${position}"><img src="${esc(poster)}" alt="" loading="lazy"></div>`:'';return `<div class="media" style="--pos:${position}"><video autoplay muted loop playsinline preload="metadata" ${poster?`poster="${esc(poster)}"`:''}><source src="${esc(b.url)}"></video></div>`}return ''}
function content(c,s){const title=s.title|| (s.type==='profile'?(c.name||c.nameEn||'') :s.type==='role'?[c.position,c.department].filter(Boolean).join(' · '):s.type==='contact'?'Contact':s.type==='links'?'Links':'');const role=[c.position,c.department].filter(Boolean).join(' · ');let inner='';if(s.type==='profile'){inner=`${c.profileImageUrl?`<div class="avatar"><img src="${esc(c.profileImageUrl)}" alt=""></div>`:''}<h1>${esc(title)}</h1>${c.nameEn?`<p class="en">${esc(c.nameEn)}</p>`:''}${role?`<p class="role">${esc(role)}</p>`:''}`}else if(s.type==='contact'){inner=`<h1>${esc(title)}</h1><div class="details">${c.phone?`<a href="tel:${esc(c.phone.replace(/[^0-9+]/g,''))}"><b>PHONE</b>${esc(c.phone)}</a>`:''}${c.email?`<a href="mailto:${esc(c.email)}"><b>EMAIL</b>${esc(c.email)}</a>`:''}${c.address?`<span><b>ADDRESS</b>${esc(c.address)}</span>`:''}</div>`}else if(s.type==='links'){inner=`<h1>${esc(title)}</h1><div class="actions">${c.website?`<a class="primary" href="${esc(safe(c.website))}">웹사이트</a>`:''}${s.buttonUrl?`<a href="${esc(safe(s.buttonUrl))}">${esc(s.buttonLabel||'링크 열기')}</a>`:''}</div>`}else{inner=`<h1>${esc(title)}</h1>`}if(s.body)inner+=`<p class="body">${esc(s.body)}</p>`;if(s.type!=='links'&&s.buttonUrl)inner+=`<div class="actions"><a class="primary" href="${esc(safe(s.buttonUrl))}">${esc(s.buttonLabel||'더 알아보기')}</a></div>`;return inner}
function render(c){if(!c||!c.sections||!c.sections.length){app.innerHTML='<div class="error">공개된 명함을 찾을 수 없습니다.</div>';return}app.innerHTML=c.sections.map((s,i)=>{const opacity=Math.max(0,Math.min(.9,Number((s.background||{}).overlay)||0));return `<section class="card"><div class="mark">ZNUS</div><div class="count">${String(i+1).padStart(2,'0')} / ${String(c.sections.length).padStart(2,'0')}</div>${media(s)}<div class="shade" style="--top:${Math.max(0,opacity-.22)};--dark:${opacity}"></div><div class="content">${content(c,s)}</div>${i===0?'<div class="hint">SCROLL TO EXPLORE</div>':''}</section>`}).join('');document.querySelectorAll('video').forEach(v=>v.play().catch(()=>{v.controls=false}))}
function fail(e){app.innerHTML=`<div class="error">${esc(e&&e.message||'명함 정보를 불러오지 못했습니다.')}</div>`}if(!SLUG)fail({message:'명함 주소가 올바르지 않습니다.'});else google.script.run.withSuccessHandler(render).withFailureHandler(fail).getPublicCard(SLUG);
</script></body></html>
