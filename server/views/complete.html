<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>명함 생성 완료 · ZNUS</title>
  <style>
    :root{color-scheme:dark;--ink:#f5f7ff;--muted:#98a4bd;--line:rgba(255,255,255,.12);--accent:#91a8ff;--teal:#63d8c4;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-width:320px;min-height:100vh;margin:0;color:var(--ink);background:#080b15}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0,rgba(91,119,255,.3),transparent 34rem),radial-gradient(circle at 90% 90%,rgba(52,190,172,.16),transparent 28rem),linear-gradient(135deg,#0b1020,#080b15 65%)}a{text-decoration:none;color:inherit}.page{display:grid;place-items:center;min-height:100vh;padding:28px}.card{width:min(100%,760px);padding:42px;border:1px solid var(--line);border-radius:28px;background:rgba(19,25,43,.88);box-shadow:0 30px 90px rgba(0,0,0,.3);text-align:center}.mark{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 24px;border:1px solid rgba(99,216,196,.4);border-radius:50%;color:#07151a;background:var(--teal);font-size:30px;font-weight:800;box-shadow:0 0 35px rgba(99,216,196,.2)}.eyebrow{margin:0 0 12px;color:var(--teal);font-size:11px;font-weight:800;letter-spacing:.2em}.card h1{margin:0;font-size:clamp(28px,6vw,42px);letter-spacing:-.07em}.description{margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.7}.status{margin:28px 0 0;padding:18px;border:1px solid rgba(99,216,196,.25);border-radius:16px;background:rgba(99,216,196,.07)}.status strong{display:block;color:#dffaf4;font-size:16px}.status span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.preview{width:min(100%,390px);aspect-ratio:9 / 19.5;height:auto;margin:24px auto 0;overflow:hidden;border:8px solid rgba(255,255,255,.08);border-radius:30px;background:#050505;box-shadow:0 20px 50px rgba(0,0,0,.28),0 0 0 1px var(--line)}.preview iframe{display:block;width:100%;height:100%;border:0;border-radius:22px;background:#050505}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.btn{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:12px;color:var(--ink);background:rgba(255,255,255,.08);font-size:13px;font-weight:750}.btn.primary{border-color:transparent;color:#101523;background:var(--accent)}.btn.primary:hover{background:#a9b9ff}.btn:hover{transform:translateY(-1px)}.error{color:#ff9eaa;line-height:1.6}.hidden{display:none!important}@media(max-width:560px){.card{padding:32px 22px}.preview{width:min(100%,330px)}.actions{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="page"><section class="card" aria-live="polite"><div class="mark">✓</div><p class="eyebrow">ZNUS DIGITAL CARD</p><h1>명함이 생성되었습니다.</h1><p class="description">입력하신 정보와 페이지별 배경 미디어가 저장되었고, 공개 명함을 사용할 수 있습니다.</p><div class="status" id="status"><strong>공개 상태 확인 중...</strong><span>잠시만 기다려 주세요.</span></div><div class="preview hidden" id="previewWrap"><iframe id="preview" title="생성된 공개 명함 미리보기"></iframe></div><div class="actions hidden" id="actions"><a class="btn primary" id="openCard" target="_blank" rel="noopener">공개 명함 열기</a><a class="btn" href="/input?edit=1">명함 정보 수정</a></div></section></main><script>
const statusBox=document.querySelector('#status'),actions=document.querySelector('#actions'),openCard=document.querySelector('#openCard'),previewWrap=document.querySelector('#previewWrap'),preview=document.querySelector('#preview');
const token=new URLSearchParams(location.search).get('token');
async function load(){if(!token||!/^[A-Za-z0-9_-]{20,30}$/.test(token)){statusBox.innerHTML='<strong class="error">공개 명함 정보를 확인할 수 없습니다.</strong><span>입력 페이지에서 다시 저장해 주세요.</span>';return;}try{const response=await fetch('/api/cards/'+encodeURIComponent(token));const card=await response.json();if(!response.ok)throw new Error(card.error||'공개 명함을 확인하지 못했습니다.');const url=location.origin+'/c/'+token;statusBox.innerHTML='<strong>저장 및 공개가 완료되었습니다.</strong><span>'+[card.nameKo,card.department,card.jobTitleKo].filter(Boolean).join(' · ')+'</span>';openCard.href=url;preview.src=url;previewWrap.classList.remove('hidden');actions.classList.remove('hidden');}catch(error){statusBox.innerHTML='<strong class="error">공개 명함 확인에 실패했습니다.</strong><span>'+error.message+'</span>';}}
load();
</script></body></html>
